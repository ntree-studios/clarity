services:
  clarity:
    build:
      context: .
      target: runtime
    image: clarity
    stdin_open: true
    network_mode: none
    volumes:
      - ./:/work:ro
    working_dir: /work
  dev:
    build:
      context: .
      target: dev
    image: clarity-dev
    volumes:
      - ./:/app
    working_dir: /app
    command: pytest
