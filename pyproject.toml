[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clarity"
version = "0.1.0"
description = "Deterministic prose linter for AI-slop writing tics"
requires-python = ">=3.12"
dependencies = [
  "spacy>=3.7,<4",
  "mcp>=1.2",
  "PyYAML>=6",
  "nltk>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
clarity = "clarity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clarity = ["*.yml", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
