"rule": "it-depends-conclusion"
"should_fire":
- "# Choice\n\nPick tools carefully. It depends."
"should_not_fire":
- "# Choice\n\nIt depends on load.\n\nWe measure it."
- "# Plan\n\nIt depends on the budget. Then we pick tools."
