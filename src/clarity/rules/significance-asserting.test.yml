# Fixtures. should_not_fire matters more: it proves the rule leaves normal prose alone.
"rule": "sig-noun-phrase"
"should_fire":
- "The key point is that we shipped."
- "The important part is that we shipped on time."
- "The interesting thing is how little code it took."
- "The key point was that nobody noticed."
- "The crucial question is whether users care."
- "A clever bit is that the cache warms itself."
- "The useful answer is to measure first."
"should_not_fire":
