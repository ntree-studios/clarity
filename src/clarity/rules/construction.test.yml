# Fixtures. should_not_fire matters more: it proves the rule leaves normal prose alone.
"rule": "passive-agentless"
"should_fire":
- "The build was broken."
"should_not_fire":
- "The build was broken by the team."
- "The team broke the build."
- "She wrote the report."
---
"rule": "passive-with-agent"
"should_fire":
- "The build was broken by the team."
"should_not_fire":
- "The team broke the build."
- "She wrote the report."
---
"rule": "adverb-propped-verb"
"should_fire":
- "He walked slowly to the door."
"should_not_fire":
- "He sprinted to the door."
- "He strode to the door."
- "She whispered the answer."
