# clarity default pack. Copy to clarity.yml and edit to override.
# Rules merge by id: a rule with an existing id overrides its fields,
# a new id adds a rule, `disabled: true` removes one.
version: 1

# Penalty per excess finding = category weight x severity weight.
# cap is the most a category can subtract from the 100-point score.
severity_weights: {info: 0.5, warning: 1.0, error: 1.5}

# A section shorter than min_section_words has its penalties raised by min_section_words / words,
# up to max_section_factor, so findings on a 40-word slide cost what the same density costs at
# full length. min_section_words: 0 turns it off.
scoring:
  min_section_words: 150
  max_section_factor: 4

# Reported separately from the style score. Never averaged into it.
# target_grade is a band. fail_outside_band makes --fail-under also fail on the band.
readability:
  target_grade: [8, 12]
  fail_outside_band: false

# Document-level measurements with no sentence to blame. Printed unscored; weight stays 0.0 until
# calibrated against real drafts.
prose_metrics:
  weight: 0.0
  report: [sentence_length_variance, paragraph_length_distribution, lexical_diversity,
    content_word_ratio, given_new_ordering, referential_density, mean_concreteness, novelty_rate,
    sentence_type_distribution, subordination_index, coordination_subordination_ratio,
    clauses_per_sentence, mean_dependency_depth, sentence_opener_distribution,
    paragraph_opener_repetition, voice_distribution, modal_density, nominal_verbal_ratio,
    tense_consistency, hapax_ratio, pronoun_antecedent_distance, heading_hierarchy,
    list_parallelism, sentence_overlap]

# Topic analysis: chunks of text joined into a similarity graph, topics found as graph
# communities. `clarity topics` prints the report; rules read it as records. Every value can be
# set here, in a profile, or under a rule's params.topics for that rule only.
topics:
  chunk:
    unit: paragraph        # paragraph (each paragraph and item), section (each section) or sentences
    min_words: 25          # short units merge into the next one until a chunk has this many words
    max_words: null        # split a longer unit at sentence ends; null keeps every unit whole
    min_count: 10          # fewer chunks: too short for topic analysis (PoC: under ~10 is too little data)
  vectorize:
    ngram_min: 1           # shortest n-gram counted
    ngram_max: 2           # longest n-gram counted
    min_df: 2              # drop terms found in fewer chunks than this
    sublinear_tf: true     # 1 + log(tf), so a term repeated in one chunk counts less
    stop_words: english    # scikit-learn stop-word list, or null for none
    use_lemmas: false      # vectorize spaCy lemmas instead of surface words
  graph:
    k: 6                   # each chunk links to its k most similar chunks
    min_sim: 0.03          # similarities below this make no edge
    adjacency: 0.1         # extra edge weight between consecutive chunks
    decimals: 10           # similarities are rounded to this many places before any compare
    centrality: true       # compute betweenness and closeness for each chunk
    measure_decimals: 6    # rounding of published graph measures
  communities:
    min_chunks: 2          # a community smaller than this is unassigned (topic -1)
    min_modularity: 0.2    # below this modularity the text is reported as one topic
    resolution: 1.0        # above 1.0 gives more, smaller topics
  labels:
    top_n: 6               # terms kept per topic and per chunk
  smoothing:
    window: 3              # majority vote over this many chunks before finding shifts
  align:
    sink: 0.05             # weight to "none of these"; raise it and more chunks align to none
    boost: 3.0             # pull of a named topic compared with chunk-to-chunk edges
    on_topic_min: 0.5      # anchor alignment a chunk needs to count as on topic (uncalibrated)
  anchor: title            # main topic is closest to: title (the root section's title, else the
                           # first title), first-heading (the first title), literal text, or none
  named: {}                # topics to measure alignment with, as {name: description words}
  # What the text is supposed to be about. Optional; empty changes nothing. Keywords join the
  # TF-IDF vocabulary even when rare, add to the anchor, and are counted per chunk and section
  # (lemma or surface match). named entries add named topics: {name: {keywords, description}}.
  focus:
    keywords: []
    description: ""
    named: {}

# Settings the paragraphs and sections record sets read. Rules query them with function: query;
# `clarity surface --records` lists every record set and field.
records:
  # Words in a heading that name a section's kind. The first kind with a match wins; else other.
  section_kinds:
    introduction: [introduction, overview, background, motivation]
    methods: [method, methods, methodology, approach]
    procedure: [steps, procedure, install, installation, setup, usage, tutorial]
    results: [results, findings, evaluation]
    conclusion: [conclusion, conclusions, summary, takeaways]
  # Phrases that mark a paragraph whose last sentence asserts significance.
  significance: [this matters, the key takeaway, a testament to, underscores the, highlights the
    importance, plays a crucial role, plays a vital role, cannot be overstated, is essential for,
    paving the way]

# Add terms without writing a rule. Findings report under the watchlist category.
# watchlist:
#   - {term: synergy, max_per_1k: 0}
#   - {term: "load-bearing", max_per_1k: 0, match: phrase}
#   - {term: bedrock, max_per_1k: 1, require_concrete_governor: true}

categories:
  - {n: 1, id: significance-asserting, name: Significance-asserting noun phrases, weight: 1.5, cap: 14}
  - {n: 2, id: discovery-narration, name: Discovery narration, weight: 1.1, cap: 10}
  - {n: 3, id: escalation, name: Escalation, weight: 1.3, cap: 12}
  - {n: 4, id: intensifiers, name: Intensifiers, weight: 1.2, cap: 12}
  - {n: 5, id: filler-transitions, name: Filler transitions, weight: 1.0, cap: 10}
  - {n: 6, id: corporate-vocabulary, name: Corporate vocabulary, weight: 1.6, cap: 18}
  - {n: 7, id: structural-tics, name: Structural tics, weight: 1.5, cap: 24}
  - {n: 8, id: hedges, name: Hedges, weight: 1.2, cap: 12}
  - {n: 9, id: false-balance, name: False balance, weight: 1.4, cap: 12}
  - {n: 10, id: false-agency, name: False agency, weight: 1.4, cap: 14}
  - {n: 11, id: verbosity, name: Verbosity, weight: 1.5, cap: 15}
  - {n: 12, id: sentence-flow, name: Sentence flow and punctuation, weight: 2.0, cap: 15}
  - {n: 13, id: watchlist, name: User watchlist, weight: 2.0, cap: 15}
  - {n: 14, id: self-framing, name: Self-framing, weight: 1.5, cap: 14}
  - {n: 15, id: construction, name: Construction, weight: 1.1, cap: 12}
  - {n: 16, id: redundancy, name: Redundancy, weight: 1.3, cap: 12}
  - {n: 17, id: prose-metrics, name: Prose metrics, weight: 1.0, cap: 5}
  - {n: 18, id: composite, name: Composite tells, weight: 1.5, cap: 14}
  - {n: 19, id: topic-structure, name: Topic structure, weight: 1.0, cap: 10}
  - {n: 20, id: artifacts, name: Chat and template artifacts, weight: 2.0, cap: 20}

rules:
  - id: sig-noun-phrase
    description: "A noun phrase that rates the next point before giving it, such as \"the key thing is\", \"the interesting part is\" or \"the hard part is\". The reader waits through a label and still has to judge the point."
    remediation: "Delete the label and start with the point. \"The key thing is the backup runs at night\" becomes \"The backup runs at night.\""
    applies_to: [title, subtitle, text, items]  # phrase-level tic; it shows in a heading too
    category: significance-asserting
    max_per_1k: 0
    severity: warning
    confidence: exact
    message: Significance-asserting noun phrase. State the point directly.
    pattern:
      - {POS: DET}
      - {LEMMA: {IN: [useful, interesting, important, key, crucial, clever, hard, tricky, difficult, real,
          main, big]}}
      - {LEMMA: {IN: [part, thing, point, bit, piece, question, answer, problem, challenge]}}
      - {LEMMA: be}
  - id: sig-frame
    description: "A stock opener that announces an answer, such as \"the short answer is\" or \"the real question is\". It adds a clause and tells the reader to pay attention without giving a reason."
    remediation: "Delete the opener and give the answer. \"The short answer is no\" becomes \"No.\""
    applies_to: [title, subtitle, text, items]  # phrase-level tic; it shows in a heading too
    category: significance-asserting
    max_per_1k: 0
    severity: warning
    confidence: exact
    message: Announces significance instead of stating it.
    phrases: [the real question is, the short answer is, what matters here is, the thing to understand is, the key takeaway is, the main takeaway is,
      the bottom line is]
  - id: discovery-narration
    description: "Narration that presents a plain fact as a surprise, using \"it turns out\", \"as it happens\" or \"funnily enough\". The reveal adds drama and no information."
    remediation: "Report the fact plainly. \"It turns out the disk was full\" becomes \"The disk was full.\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: discovery-narration
    max_per_1k: 0
    severity: warning
    confidence: exact
    position: clause-initial
    message: Discovery narration. Report the fact without the reveal.
    phrases: [turns out, turned out, it turns out, it turned out, as it happens, funnily enough, oddly enough, somehow]
  - id: escalation-not-just
    description: "The \"not just X, but Y\" build-up, where the writer sets up a small claim only to top it. The first half gives the reader nothing new, and the shape inflates the second half."
    remediation: "State Y alone, and keep X only if it is news to the reader. \"It's not just fast, it's reliable\" becomes \"It recovers from a crash in two seconds.\""
    applies_to: [title, subtitle, text, items]  # phrase-level tic; it shows in a heading too
    category: escalation
    backend: structural
    function: escalation_window
    max_per_1k: 0
    severity: error
    confidence: exact
    message: '"Not just X" escalation. State Y without the setup.'
    params: {then_within: 3, followed_by: [but, it, ","], within: 12}
  - id: escalation-phrase
    description: "Stock escalation phrases such as \"more than that\" or \"and that's before you even consider\". They promise a bigger point and make the reader wait for it."
    remediation: "Delete the phrase and give the next point as its own sentence. \"More than that, it saves money\" becomes \"It also cuts the power bill by a tenth.\""
    applies_to: [title, subtitle, text, items]  # phrase-level tic; it shows in a heading too
    category: escalation
    max_per_1k: 0
    severity: error
    confidence: exact
    message: Escalation phrase.
    lower_phrases: [more than that, "and that's before you even consider", and that is before you even consider, "isn't just about", is not just about]
  - id: intensifier
    description: "Words such as \"really\", \"truly\", \"genuinely\" or \"notably\" that add emphasis and no facts. This is a general style rule that fires past one per thousand words. Used often, these words make every claim sound equally loud, so none of them stand out."
    remediation: "Cut the word, or put the evidence in its place. \"This is really fast\" becomes \"This page loads in 40 ms.\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: intensifiers
    max_per_1k: 1
    severity: warning
    confidence: exact
    match: lower
    message: Intensifier adds no information. A style rule, not a sign of AI writing; cut it or give the evidence.
    phrases: [genuinely, truly, deeply, really, actually, crucially, notably, importantly, significantly]
  - id: intensifier-frame
    description: "\"To be clear\" and \"make no mistake\", which tell the reader to take the next sentence seriously. They add no facts and can sound as if the writer is talking down."
    remediation: "Delete the frame and keep the sentence. \"To be clear, the deadline is Friday\" becomes \"The deadline is Friday.\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: intensifiers
    max_per_1k: 0
    severity: error
    confidence: exact
    match: lower
    message: Intensifier frame adds no information.
    phrases: [make no mistake, to be clear]
  - id: filler-worth-noting
    description: "\"It's worth noting\" and its variants, which tell the reader a sentence deserves attention before giving it."
    remediation: "Delete the phrase and start with the content. \"It's worth noting that the API is slow\" becomes \"The API is slow.\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: filler-transitions
    max_per_1k: 0
    severity: error
    confidence: exact
    message: Filler. Start with the content.
    phrases: [it's worth noting, it's worth saying, it's worth mentioning, it's worth remembering, worth noting]
  - id: filler-transition
    description: "Clause openers such as \"that said\", \"ultimately\", \"when it comes to\" and \"in terms of\" that link sentences without adding meaning. A few are normal; the rule fires past one per thousand words."
    remediation: "Delete the opener, or use a word that states the logic, such as \"but\", \"so\" or \"because\". \"When it comes to pricing, we charge monthly\" becomes \"We charge monthly.\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: filler-transitions
    max_per_1k: 1
    severity: warning
    confidence: exact
    position: clause-initial
    message: Filler transition. Start with the content.
    phrases: [that said, ultimately, at the end of the day, when it comes to, in terms of, here's the thing, the reality is, in short,
      moreover, furthermore, in conclusion, in summary, all in all, at its core, let's break it down, let's dive in, let's dive into]
  - id: corporate-tier-a
    description: "Corporate buzzwords such as \"leverage\", \"seamless\", \"robust\", \"game-changer\" and \"a testament to\". They sound like marketing and tell the reader little about what the thing does."
    remediation: "Use the plain word or the specific fact. \"We leverage the cache\" becomes \"We use the cache\", and \"a seamless upgrade\" becomes \"an upgrade with no downtime\"."
    applies_to: [title, subtitle, text, items]  # phrase-level tic; it shows in a heading too
    category: corporate-vocabulary
    max_per_1k: 1
    severity: warning
    confidence: exact
    message: Corporate vocabulary. Use a plainer word.
    phrases: [leverage, unlock, empower, seamless, robust, holistic, streamline, elevate, transform, underscore, speaks volumes]
    lower_phrases: [game-changer, game changer, best-in-class, cutting-edge, a testament to, plays a vital role, play a vital role,
      plays a crucial role, plays a key role, a myriad of, bustling city, ever-evolving, changing landscape, shifting landscape,
      evolving landscape]
  - id: corporate-tier-b
    description: "\"Delve into\", \"dive into\" and \"navigate\" with an abstract object, or \"landscape of\", \"realm of\", \"tapestry of\" and \"ecosystem of\" before an abstract noun. The metaphor is vague and the reader has to guess the literal meaning."
    remediation: "Say the literal action or thing. \"We dive into the results\" becomes \"We compare the results by region\", and \"the landscape of payments\" becomes \"payment companies\"."
    applies_to: [title, subtitle, text, items]  # phrase-level tic; it shows in a heading too
    category: corporate-vocabulary
    backend: dependency
    max_per_1k: 0
    severity: warning
    confidence: inferred
    anchor: obj
    concreteness_max: 3.0
    message: Metaphorical use. The governed noun is abstract.
    patterns:
      - - {RIGHT_ID: head, RIGHT_ATTRS: {LEMMA: {IN: [delve, navigate]}, POS: VERB}}
        - {LEFT_ID: head, REL_OP: ">", RIGHT_ID: obj, RIGHT_ATTRS: {DEP: dobj}}
      - - {RIGHT_ID: head, RIGHT_ATTRS: {LEMMA: {IN: [delve, dive]}, POS: VERB}}
        - {LEFT_ID: head, REL_OP: ">", RIGHT_ID: prep, RIGHT_ATTRS: {LOWER: into}}
        - {LEFT_ID: prep, REL_OP: ">", RIGHT_ID: obj, RIGHT_ATTRS: {DEP: pobj}}
      - - {RIGHT_ID: head, RIGHT_ATTRS: {LEMMA: {IN: [landscape, realm, tapestry, ecosystem]}, POS: NOUN}}
        - {LEFT_ID: head, REL_OP: ">", RIGHT_ID: prep, RIGHT_ATTRS: {LOWER: of}}
        - {LEFT_ID: prep, REL_OP: ">", RIGHT_ID: obj, RIGHT_ATTRS: {DEP: pobj}}
  - id: figurative-cost
    description: "The verb \"cost\" used for anything other than a price, as in \"the bug cost us trust\" or \"a missing comma costs points\". The reader has to work out what happens."
    remediation: "Say what happens. For a score, write \"lowers the score\": \"A missing comma costs points\" becomes \"A missing comma lowers the score.\" For people, say what they do: \"The delay cost us trust\" becomes \"Two clients asked for weekly updates after the delay.\""
    applies_to: [title, subtitle, text, items]  # phrase-level tic; it shows in a heading too
    category: corporate-vocabulary
    backend: structural
    function: figurative_cost
    max_per_1k: 0
    severity: warning
    confidence: inferred
    message: '"Cost" used figuratively. It means money or true cost; say what actually happens.'
  - id: not-yet-placement
    description: "\"Not yet\" placed before the verb, as in \"does not yet ingest\" or \"has not yet shipped\". It reads as stiff, old-fashioned prose and the negation and \"yet\" pull against each other."
    remediation: "Move \"yet\" to the end. \"The team does not yet ingest nine more systems\" becomes \"The team does not ingest nine more systems yet.\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: construction
    backend: dependency
    max_per_1k: 0
    severity: warning
    confidence: exact
    message: '"Not yet" before the verb. Put "yet" at the end of the clause.'
    patterns:
      - - {RIGHT_ID: verb, RIGHT_ATTRS: {POS: VERB}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: neg, RIGHT_ATTRS: {LOWER: not, DEP: neg}}
        - {LEFT_ID: neg, REL_OP: ".", RIGHT_ID: yet, RIGHT_ATTRS: {LOWER: yet, DEP: advmod}}
    anchor: yet
  - id: stock-obstacle-idiom
    description: "\"Stand in the way\" for an obstacle, as in \"six gaps stand in the way\". It is a stock idiom that names no actual blocker."
    remediation: "Say what the obstacle stops. \"Six gaps stand in the way\" becomes \"Six gaps block the migration.\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: construction
    max_per_1k: 0
    severity: warning
    confidence: exact
    match: lower
    message: Stock idiom for an obstacle. Say what is blocked.
    lower_phrases: [stand in the way, stands in the way, stood in the way, standing in the way]
  - id: data-sits-in
    description: "\"Sit\" used for where data is kept, as in \"the records sit in 13 systems\". The verb pictures an object resting somewhere and says nothing about how the data is stored or used."
    remediation: "Use a plain verb. \"The records sit in 13 systems\" becomes \"The records are stored in 13 systems.\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: construction
    backend: dependency
    max_per_1k: 0
    severity: warning
    confidence: inferred
    message: '"Sit" for where data is kept. Use "are stored" or "live in".'
    patterns:
      - - {RIGHT_ID: verb, RIGHT_ATTRS: {LEMMA: sit, POS: VERB}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: subj, RIGHT_ATTRS: {DEP: nsubj, LEMMA: {IN: [record, data, datum, information, file, document]}}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: loc, RIGHT_ATTRS: {LOWER: in, DEP: prep}}
    anchor: verb
  - id: verb-then-no-noun
    description: "A verb followed by \"no\" and its object, as in \"publish no documentation\". The negation sits on the noun, so the sentence says the thing does not exist when the writer means the subject does not do the action."
    remediation: "Negate the verb. \"The vendors publish no documentation\" becomes \"The vendors do not publish documentation.\" Verbs such as \"have\", \"make\" and \"take\" are skipped because \"has no\" is plain English."
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: construction
    backend: dependency
    max_per_1k: 0
    severity: warning
    confidence: inferred
    message: '"No" negates the noun, not the action. Negate the verb: "do not publish documentation".'
    patterns:
      - - {RIGHT_ID: verb, RIGHT_ATTRS: {POS: VERB, LEMMA: {NOT_IN: [have, be, make, take, do, see, give]}}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: obj, RIGHT_ATTRS: {DEP: dobj}}
        - {LEFT_ID: obj, REL_OP: ">", RIGHT_ID: negator, RIGHT_ATTRS: {LOWER: "no", DEP: det}}
    anchor: negator
  - id: dangling-colon
    description: "A text that ends on a colon, as in \"Six gaps stand in the way:\" with nothing after it. The sentence promises a list or an explanation and the reader gets neither."
    remediation: "Add the list or the explanation, or end the sentence with a period and give the content in the next sentence."
    applies_to: [text, items]  # checks the last token of the whole input
    category: construction
    backend: structural
    function: dangling_colon
    max_per_1k: 0
    severity: warning
    confidence: exact
    message: Colon that introduces nothing. Add what it promises or end the sentence.
  - id: stock-title-shape
    description: "A title built on a stock pattern. One is a short label, a colon and a claim, as in \"Search: built for scale\". Another is \"N things, one thing\", as in \"Two teams, one goal\". Others end in \", and what it means\" or in \", each one\" plus an \"-ing\" verb. These shapes sound like a point without stating one. Human headings in the test corpora never matched them."
    remediation: "Write the title as the point of the section in plain words. \"Two teams, one goal\" becomes \"Sales and support now share one ticket queue.\""
    category: structural-tics
    applies_to: [title, subtitle]
    max_per_1k: 0
    severity: error
    confidence: exact
    message: Stock title shape. A title should state the point of its section in plain words.
    pattern:
      # "Pricing: simple plans, built for growth" (a short label, a colon, then a claim). The
      # part after the colon must hold a promotional word, so a factual title such as
      # "Billing schedule: each invoice follows a deliverable, then a payment" is left alone.
      - [{IS_SENT_START: true, IS_PUNCT: false}, {IS_PUNCT: false, OP: "{0,2}"}, {ORTH: ":"},
         {IS_PUNCT: false, OP: "{0,4}"},
         {LOWER: {IN: [simple, simpler, powerful, seamless, seamlessly, effortless, effortlessly,
           smart, smarter, faster, better, built, designed, crafted, reimagined, modern,
           scalable, scale, growth, future]}},
         {IS_PUNCT: false, OP: "*"}, {ORTH: {IN: [",", ";", "\u2014", "\u2013"]}}]
      # "Three teams, one shared vision" / "Three teams. One vision."
      - [{LIKE_NUM: true}, {IS_PUNCT: false, OP: "{1,3}"}, {ORTH: {IN: [",", ".", ";", ":", "\u2014", "\u2013"]}}, {LOWER: {IN: [one, a, single]}},
         {IS_PUNCT: false, OP: "{1,3}"}]
      # "What we learned, and why it counts" / "Open risks; and how we track them"
      - [{ORTH: {IN: [",", ".", ";", ":", "\u2014", "\u2013"]}}, {LOWER: and}, {LOWER: {IN: [what, how, why, where, who]}}]
      # "four steps, each one building on the last"
      - [{ORTH: {IN: [",", ".", ";", ":", "\u2014", "\u2013"]}}, {LOWER: each}, {LOWER: one, OP: "?"}, {TAG: VBG}]
      # "Two teams. One goal." (a title made of two short fragments)
      - [{IS_PUNCT: false, IS_SPACE: false, OP: "{1,5}"}, {ORTH: {IN: [".", ";", "\u2014", "\u2013"]}},
         {IS_ALPHA: true}]
      # "How this works." / "What we found." (a teaser question written as a statement)
      - [{IS_SENT_START: true, LOWER: {IN: [what, how, why, where, who]}}, {IS_PUNCT: false, OP: "{1,6}"},
         {ORTH: "."}]
  - id: repeated-title-shape
    description: "Most section titles in a document follow one or two stock templates: two clipped sentences (\"Two regions. One ledger.\"), a bare denial (\"Speed is not quality.\") or a slogan command (\"Earn trust with every release.\"). One such title can be a choice. When most titles share the template, the document reads as generated, and the titles stop telling sections apart."
    remediation: "Rewrite each title to state what its section finds or decides, in plain words. \"Two regions. One ledger.\" becomes \"Both regions now post to the same ledger.\""
    category: structural-tics
    backend: structural
    function: repeated_title_shape
    applies_to: [title]
    count_scope: document
    max_per_1k: 0
    severity: error
    confidence: inferred
    message: Most section titles share one stock template. Write each title as the point of its section.
    params: {min_titles: 4, min_share: 0.6}
  - id: count-noun-title
    description: "A title made only of a count and a noun, such as \"Ten topics\" or \"Three key risks\". It tells the reader how many things follow and nothing about them."
    remediation: "Name the subject or the point. \"Ten topics\" becomes \"What the session covers\" or \"Data quality, matching and access\"."
    category: structural-tics
    applies_to: [title, subtitle]
    max_per_1k: 0
    severity: warning
    confidence: exact
    message: A title that is only a count and a noun ("Ten topics"). It says how many, and nothing about them.
    params: {whole_field: true}  # the whole title, so "Ten topics we cover today" is left alone
    pattern:
      - [{LIKE_NUM: true}, {POS: ADJ, OP: "*"}, {POS: NOUN, OP: "+"}]
  - id: count-noun-fragment
    description: "A sentence made only of a count and a noun, such as \"Two reasons.\", used to build suspense before a list."
    remediation: "Fold the count into the sentence that gives the reasons. \"Two reasons. First, the cache is cold.\" becomes \"The cache is cold, and the index is missing.\""
    experimental: true  # until checked on the human corpora for recipe-style lines ("Two eggs.")
    category: structural-tics
    applies_to: [text]
    max_per_1k: 0
    severity: warning
    confidence: exact
    message: A sentence that is only a count and a noun ("Two reasons."), used as a drumroll.
    pattern:
      - [{IS_SENT_START: true, LIKE_NUM: true}, {POS: ADJ, OP: "*"}, {POS: NOUN, OP: "+"},
         {ORTH: {IN: [".", ":", ";"]}}]
  - id: weak-title
    description: "A title or subtitle with two or more signs that it says nothing: a stock title shape, a run of three stacked nouns, or a share of small words outside the normal band. Human headings in the test corpora never matched it."
    remediation: "Rewrite the title as a short sentence that states the finding of the section. \"Data platform strategy alignment\" becomes \"Move all reports to one database by June.\""
    category: composite
    backend: composite
    applies_to: [title, subtitle]
    count_scope: sentence
    max_per_scope: 0
    severity: warning
    confidence: inferred
    message: Weak title. Two or more signs that it sounds like a point without stating one.
    requires_any:
      - {rule: stock-title-shape}
      - {rule: noun-stack-title}
      - {rule: function-word-ratio}
    min_any: 2
  - id: fragment-triad
    description: "Two or more sentence fragments in a row, such as \"Fast. Cheap. Good.\" or \"No meetings. No slides. Just code.\" The clipped rhythm is a slogan device and leaves the reader to fill in the verbs."
    remediation: "Join them into one full sentence with a subject and a verb. \"Not a patch. A rebuild.\" becomes \"We rewrote the parser from scratch.\""
    applies_to: [text]  # judges full sentences; titles, subtitles and items are fragments
    category: structural-tics
    backend: structural
    function: consecutive_fragments
    max_per_1k: 0
    severity: error
    confidence: exact
    message: Consecutive sentence fragments.
    params: {min_run: 2, boost_on_shared_opener: true}
  - id: abstract-triad
    description: "A list of three abstract adjectives or nouns, such as \"fast, reliable, and secure\" or \"trust, clarity, and accountability\". Models reach for three because it sounds complete, and the third item often adds nothing. People write triads too, so this is a weak signal that counts only past a small allowance."
    remediation: "Keep the item you can back with a fact and say what it means. \"Fast, reliable, and secure\" becomes \"Requests finish in 40 ms and the service has not gone down since March.\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: structural-tics
    backend: dependency
    max_per_1k: 2
    severity: info
    confidence: inferred
    anchor: abs
    concreteness_max: 3.7
    message: Triad of abstract words. Keep the one you can support and say what it means.
    patterns:
      - - {RIGHT_ID: first, RIGHT_ATTRS: {POS: ADJ}}
        - {LEFT_ID: first, REL_OP: ">", RIGHT_ID: second, RIGHT_ATTRS: {POS: ADJ, DEP: conj}}
        - {LEFT_ID: second, REL_OP: ">", RIGHT_ID: abs, RIGHT_ATTRS: {POS: ADJ, DEP: conj}}
      - - {RIGHT_ID: first, RIGHT_ATTRS: {POS: {IN: [NOUN, PROPN]}}}  # the tagger reads a sentence-medial "trust" as a name
        - {LEFT_ID: first, REL_OP: ">", RIGHT_ID: second, RIGHT_ATTRS: {POS: NOUN, DEP: conj}}
        - {LEFT_ID: second, REL_OP: ">", RIGHT_ID: abs, RIGHT_ATTRS: {POS: NOUN, DEP: conj}}
  - id: slogan-sentence-run
    description: "Two or more very short sentences in a row with no article, pronoun or number, such as \"Teams change. Contracts stay.\" or \"Ship small. Measure often. Scale on proof.\" Fragment-triad does not catch the run because each sentence has a verb. The reader still cannot tell who does what or when."
    remediation: "Join them into one sentence that names who acts and in which case. \"Teams change. Contracts stay.\" becomes \"When we reorganize a team, its supplier contracts stay with the company.\""
    applies_to: [text, items]  # titles have stock-title-shape for the same beat
    category: structural-tics
    backend: structural
    function: slogan_sentence_run
    max_per_1k: 0
    severity: error
    confidence: inferred
    message: Run of short slogan sentences. Join them and say who does what.
    params: {max_words: 5, min_run: 2}
  - id: slogan-imperative-title
    description: "A short command in a title, kicker or item, built on a slogan verb and abstract nouns, such as \"Turn insight into impact\" or \"Build trust through transparency\". It sounds like a call to action, but it does not name a task anyone could do."
    remediation: "Name the task, the owner or the result. \"Connect data to decisions\" becomes \"Show each region's weekly churn on the sales dashboard.\""
    applies_to: [title, subtitle, items]  # slide kickers and taglines; body text has its own rules
    category: structural-tics
    backend: structural
    function: slogan_imperative
    max_per_1k: 0
    severity: error
    confidence: inferred
    message: Slogan command with abstract objects. Name the task, owner or result.
    params:
      max_words: 7
      concreteness_mean_max: 3.6  # mean concreteness of the nouns; "printer" or "file handle" clears it
      verbs: [connect, turn, close, unlock, build, drive, capture, make, protect, accelerate, bridge, earn,
        empower, transform, deliver, align, scale, elevate, harness, fuel, unleash, sequence, prove, expand,
        own, embrace, reimagine, maximize, streamline, foster, cultivate, amplify, simplify, champion,
        operationalize, democratize, turbocharge, supercharge]
  - id: question-then-answer
    description: "A rhetorical question followed at once by an answer that repeats its words, as in \"Why does the cache fail? The cache fails because...\". The question adds a sentence and no information."
    remediation: "Drop the question and keep the answer. \"Why does it fail? It fails because keys go stale\" becomes \"The cache fails because keys go stale.\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: structural-tics
    backend: structural
    function: question_answer
    max_per_1k: 0
    severity: warning
    confidence: inferred
    message: Rhetorical question answered immediately.
    params: {jaccard: 0.4, containment: true}
  - id: section-restatement
    description: "A section whose last sentence repeats its first. The reader gets the same point twice and no conclusion."
    remediation: "Cut the closing sentence, or replace it with a result or next step the section has not given yet."
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: redundancy
    backend: structural
    function: section_restatement
    count_scope: section
    max_per_scope: 0
    severity: warning
    confidence: inferred
    message: Section closes by restating its opening.
    params: {jaccard: 0.5, min_sentences: 3}
  - id: x-rather-than-y
    description: "The \"X rather than Y\" contrast. One is fine; past one per thousand words it becomes a habit of defining each choice by the option the writer turned down."
    remediation: "Say what was chosen and why, and mention the other option only if the reader expected it. \"We chose speed rather than safety\" becomes \"We chose speed because the demo is on Monday.\""
    applies_to: [title, subtitle, text, items]  # phrase-level tic; it shows in a heading too
    category: structural-tics
    max_per_1k: 1
    severity: warning
    confidence: exact
    match: lower
    message: '"X rather than Y" construction.'
    phrases: [rather than]
  - id: trailing-negation
    description: "Defines a thing by denying something nobody claimed: \"X, not Y\", \"isn't X, it's Y\", \"not X but Y\", \"explains, never decides\" and \"reviews instead of rewriting\". AI-written text uses it several times more often than people do. It also fires after a dash and at the end of a field with no period."
    remediation: "Say what the thing is and cut the denial. Keep a \"not\" only when a reader would otherwise believe the denied claim. \"It's a guide, not a rulebook\" becomes \"It's a guide.\""
    applies_to: [title, subtitle, text, items]  # phrase-level tic; it shows in a heading too
    category: structural-tics
    max_per_1k: 0
    severity: warning
    confidence: exact
    message: 'Reframe by negation ("X, not Y", "isn''t X, it''s Y", "not X but Y"). Say what it is and drop the denial.'
    pattern:
      # "..., not Y." at the end of a sentence, after a comma or a dash
      - [{ORTH: {IN: [",", "\u2014", "\u2013"]}}, {LOWER: not}, {IS_PUNCT: false, LOWER: {NOT_IN: [least, only, to,
          that, because, necessarily, yet, always, all, every, once, even, quite, unlike, surprisingly, including]}},
         {IS_PUNCT: false, OP: "{0,4}"}, {ORTH: {IN: [".", "!", ";"]}}]
      # "Quality first, not speed" / "teams—not projects" ending a title, kicker, item or footer with no
      # period. sent_end marks the last token of a sentence, and every field starts a new sentence.
      - [{ORTH: {IN: [",", "\u2014", "\u2013"]}}, {LOWER: not}, {IS_PUNCT: false, LOWER: {NOT_IN: [least,
          to, that, because, necessarily, yet, always, all, every, once, even, quite, unlike, surprisingly,
          including]}, _: {sent_end: true}}]
      - [{ORTH: {IN: [",", "\u2014", "\u2013"]}}, {LOWER: not}, {IS_PUNCT: false, LOWER: {NOT_IN: [least,
          to, that, because, necessarily, yet, always, all, every, once, even, quite, unlike, surprisingly,
          including]}}, {ORTH: {NOT_IN: [",", ";", ":", ".", "!", "?", "(", ")", "\u2014", "\u2013"]},
          LOWER: {NOT_IN: [but, also]}, OP: "{0,6}"},
         {_: {sent_end: true}}]
      # ... ending in a quoted phrase: 'one flag per reader—not one global "allowed = yes."'
      - [{ORTH: {IN: [",", "\u2014", "\u2013"]}}, {LOWER: not}, {IS_PUNCT: false, LOWER: {NOT_IN: [least,
          to, that, because, necessarily, yet, always, all, every, once, even, quite, unlike, surprisingly,
          including]}}, {ORTH: {NOT_IN: [",", ";", ":", ".", "!", "?", "(", ")", "\u2014", "\u2013"]},
          LOWER: {NOT_IN: [but, also]}, OP: "{0,6}"},
         {ORTH: {IN: [".", "!"]}}, {ORTH: {IN: ["\"", "\u201d", "'", "\u2019"]}, _: {sent_end: true}}]
      # "isn't X, it's Y"
      - [{LOWER: {IN: [is, was, are, were, "'s", "’s"]}}, {LOWER: {IN: [not, "n't", "n’t"]}}, {IS_PUNCT: false, OP: "{1,8}"},
         {ORTH: {IN: [",", ";"]}}, {LOWER: {IN: [it, they, this, that]}}, {LOWER: {IN: [is, "'s", "’s", are, "'re", "’re", was, were]}}]
      # "is not X but Y". Skips "not only/just X but also Y" (escalation-not-just), a degree word after
      # "not" ("not completely understood, but") and a new clause after "but" ("is not enough, but it
      # can"): on human science and business text those were concessions, not reframes.
      - [{LOWER: {IN: [is, was, are, were, "'s", "’s"]}}, {LOWER: {IN: [not, "n't", "n’t"]}},
         {IS_PUNCT: false, LOWER: {NOT_IN: [only, just, merely, simply, so, as, completely, entirely, exactly, fully,
           particularly, necessarily, always, quite, very, too, enough, yet, uncommon, unusual]}},
         {IS_PUNCT: false, OP: "{0,7}"}, {ORTH: ",", OP: "?"}, {LOWER: but},
         {LOWER: {NOT_IN: [also, it, they, he, she, we, i, you, this, that, there, these, those, when, if, since, while,
           is, are, was, were, with, still, can, could, may, might, will, would, should, do, does, did]}}]
      # "not because X but because Y"
      - [{LOWER: not}, {LOWER: because}, {IS_PUNCT: false, OP: "{1,10}"}, {ORTH: ",", OP: "?"}, {LOWER: but}, {LOWER: because}]
      # "..., not in its path, so ..." in mid-sentence (an adverb after "not" is a hedge, not a reframe)
      - [{ORTH: ","}, {LOWER: not}, {IS_PUNCT: false, POS: {NOT_IN: [ADV, PART]}, LOWER: {NOT_IN: [least, only, to, that,
          because, necessarily, yet, always, all, every, once, even, quite, unlike]}}, {IS_PUNCT: false, OP: "{0,4}"},
         {ORTH: ","}, {LOWER: {IN: [so, and, which, because, but]}}]
      # "Claude explains, never sets the price"
      - [{POS: VERB}, {ORTH: ","}, {LOWER: never}, {POS: VERB}]
      # "the team reviews instead of rewriting" (a noun before "instead", as in "use X instead of Y", is advice)
      - [{POS: VERB}, {LOWER: instead}, {LOWER: of}, {TAG: VBG}]
  - id: bare-denial
    description: "A short sentence that only denies, such as \"Speed is not quality\", \"Shipped \u2260 adopted\" or \"A login never grants access\". It reads like a slogan, and it tells the reader what something is not without saying what it is. Both nouns are usually abstract, and nothing follows the denial."
    remediation: "State the fact behind the denial. \"A demo is not a product\" becomes \"The demo still lacks billing, login and error handling.\""
    applies_to: [title, subtitle, text, items]  # slide titles and kickers are where it shows most
    category: structural-tics
    backend: structural
    function: bare_denial
    max_per_1k: 0
    severity: error
    confidence: inferred
    message: 'Bare denial ("X is not Y", "X \u2260 Y"). Say what X is, or give the fact behind the denial.'
    params: {max_words: 10, concreteness_max: 4.2}  # one noun must rate below this
  - id: comparative-maxim
    description: "A rule of thumb shaped like \"A X is worse than a Y\" or \"Done is better than perfect\". It sounds wise, but it does not give a case, a number or a cost."
    remediation: "Give the case and the cost. \"A late shipment is worse than a partial one\" becomes \"A late shipment misses the customer's launch date. A partial one delays two accessories.\""
    applies_to: [title, subtitle, text, items]  # slide kickers carry it most
    category: structural-tics
    max_per_1k: 0
    severity: error
    confidence: exact
    message: Comparative maxim ("A X is worse than a Y"). Give the case and the cost instead.
    # A word slot: anything but a preposition, finite verb, pronoun or number, so "a Ford for long trips"
    # and "than me at chess" stay clean. Every shape must end its sentence (sent_end).
    pattern:
      # "A wrong label is worse than a missing label" / "A slow launch beats a broken launch"
      - [{IS_SENT_START: true, LOWER: {IN: [a, an]}},
         {IS_PUNCT: false, POS: {NOT_IN: [ADP, AUX, SCONJ, NUM, DET, PROPN]}, OP: "{1,3}"},
         {LEMMA: be, OP: "?"}, {LOWER: {IN: [worse, better, cheaper, safer, riskier, costlier, beats, trumps]}},
         {LOWER: than, OP: "?"}, {LOWER: {IN: [a, an, "no"]}},
         {IS_PUNCT: false, POS: {NOT_IN: [ADP, AUX, SCONJ, PRON, NUM, PROPN]}, TAG: {NOT_IN: [VBZ, VBP, VBD, VB]},
          OP: "{0,2}"},
         {IS_PUNCT: false, POS: {NOT_IN: [ADP, AUX, SCONJ, PRON, NUM, PROPN]}, _: {sent_end: true}}]
      - [{IS_SENT_START: true, LOWER: {IN: [a, an]}},
         {IS_PUNCT: false, POS: {NOT_IN: [ADP, AUX, SCONJ, NUM, DET, PROPN]}, OP: "{1,3}"},
         {LEMMA: be, OP: "?"}, {LOWER: {IN: [worse, better, cheaper, safer, riskier, costlier, beats, trumps]}},
         {LOWER: than, OP: "?"}, {LOWER: {IN: [a, an, "no"]}},
         {IS_PUNCT: false, POS: {NOT_IN: [ADP, AUX, SCONJ, PRON, NUM, PROPN]}, TAG: {NOT_IN: [VBZ, VBP, VBD, VB]},
          OP: "{1,3}"},
         {ORTH: {IN: [".", "!"]}, _: {sent_end: true}}]
      # "An honest estimate is worth more than an optimistic plan"
      - [{IS_SENT_START: true, LOWER: {IN: [a, an]}}, {IS_PUNCT: false, POS: {IN: [ADJ, NOUN, VERB]}, OP: "{1,3}"},
         {LEMMA: be}, {LOWER: worth}, {LOWER: {IN: [more, less]}}, {LOWER: than}, {LOWER: {IN: [a, an, "no"]}},
         {IS_PUNCT: false, POS: {NOT_IN: [ADP, AUX, SCONJ, PRON, NUM, PROPN]}, OP: "{1,3}"},
         {ORTH: {IN: [".", "!"]}, OP: "?", _: {sent_end: true}}]
      # "Done is better than perfect" / "Boring is better than clever"
      - [{IS_SENT_START: true, POS: {IN: [ADJ, VERB, NOUN, PROPN]}}, {LEMMA: be},
         {LOWER: {IN: [better, worse]}}, {LOWER: than}, {POS: {IN: [ADJ, VERB]}, _: {sent_end: true}}]
      - [{IS_SENT_START: true, POS: {IN: [ADJ, VERB, NOUN, PROPN]}}, {LEMMA: be},
         {LOWER: {IN: [better, worse]}}, {LOWER: than}, {POS: {IN: [ADJ, VERB]}}, {ORTH: {IN: [".", "!"]}}]
  - id: which-is-exactly
    description: "An emphatic tag such as \"which is exactly what we need\" or \"which is the point\". It tells the reader to agree without showing why."
    remediation: "End the sentence at the fact, and give the reason in its own sentence if one is needed. \"The cache halves load, which is exactly the point\" becomes \"The cache halves load.\""
    applies_to: [title, subtitle, text, items]  # phrase-level tic; it shows in a heading too
    category: structural-tics
    max_per_1k: 0
    severity: warning
    confidence: exact
    message: Emphatic "which is" tag.
    phrases: [which is exactly, which is the point]
  - id: em-dash
    description: "An em dash or en dash used as punctuation. Heavy use breaks sentences into asides, and many readers now take frequent dashes as a sign of generated text."
    remediation: "Use a comma, a colon or a period in place of the dash, or parentheses for a true aside. Write \"The fix was one line, and it shipped today.\""
    applies_to: [title, subtitle, text, items]  # phrase-level tic; it shows in a heading too
    category: structural-tics
    backend: structural
    function: em_dash
    max_per_1k: 0
    severity: error
    confidence: exact
    message: Em or en dash. Use a comma, colon, or period.
    params: {chars: ["\u2014", "\u2013"]}
  - id: hedge
    description: "Hedges such as \"arguably\", \"somewhat\", \"can help to\" and \"one of the most\". This is a general style rule that fires past two per thousand words. Too many make the writer sound unsure of every claim."
    remediation: "Drop the hedge when you are sure, or say what the doubt is. \"This can help to reduce errors\" becomes \"This cut errors by a third in March.\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: hedges
    max_per_1k: 2
    severity: info
    confidence: exact
    message: Hedge. A style rule, not a sign of AI writing; drop it when you are sure, or say what the doubt is.
    phrases: [can help to, may be able to, arguably, somewhat, one of the most]
  - id: hedge-stacking
    description: "Two or more hedges in one clause, as in \"arguably somewhat faster\" or \"can help to typically reduce\". Each one weakens the claim until the reader cannot tell what the writer believes."
    remediation: "Keep at most one hedge, the one that states the real doubt. \"This can arguably help to reduce errors\" becomes \"This may reduce errors.\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: hedges
    backend: structural
    function: hedge_stacking
    count_scope: clause
    max_per_scope: 1
    severity: error
    confidence: exact
    message: Two or more hedges in one clause.
    params:
      min_count: 2
      phrases: [can help to, may be able to, arguably, somewhat, one of the most, often, typically, generally]
  - id: false-balance-while
    description: "The concession \"While X, it is also true that Y\". It puts two claims side by side and never says which one the writer accepts."
    remediation: "Say which claim wins and why. \"While speed is good, it is also true that safety is good\" becomes \"Safety comes first, so we accept a slower release.\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: false-balance
    backend: dependency
    max_per_1k: 0
    severity: error
    confidence: inferred
    message: Concessive "While X, it is also true that Y".
    patterns:
      - - {RIGHT_ID: main, RIGHT_ATTRS: {POS: {IN: [AUX, VERB]}}}
        - {LEFT_ID: main, REL_OP: ">", RIGHT_ID: adv, RIGHT_ATTRS: {DEP: advcl}}
        - {LEFT_ID: adv, REL_OP: ">", RIGHT_ID: mark, RIGHT_ATTRS: {LOWER: {IN: [while, although, though, whilst]}}}
        - {LEFT_ID: main, REL_OP: ">", RIGHT_ID: truth, RIGHT_ATTRS: {LEMMA: "true"}}
    anchor: mark
  - id: false-balance-phrase
    description: "\"There's no one-size-fits-all\" and its variants. The phrase avoids an answer while sounding like one."
    remediation: "Give the options and say when each one fits. \"There's no one-size-fits-all plan\" becomes \"Teams under ten people should use the free tier.\""
    applies_to: [title, subtitle, text, items]  # phrase-level tic; it shows in a heading too
    category: false-balance
    match: lower
    max_per_1k: 0
    severity: error
    confidence: exact
    message: '"No one-size-fits-all" is a non-answer.'
    phrases: [there's no one-size-fits-all, no one-size-fits-all, one-size-fits-all]
  - id: it-depends-conclusion
    description: "A section that ends on \"It depends.\" The reader reaches the end with no answer."
    remediation: "Say what it depends on and give the answer for each case. \"It depends.\" becomes \"Use the small plan below 1,000 users and the large plan above that.\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: false-balance
    backend: structural
    function: it_depends_final
    position: section-final
    max_per_1k: 0
    severity: error
    confidence: inferred
    message: '"It depends" as a section-final sentence.'
  - id: false-agency
    description: "An inanimate subject with a verb that needs a person, such as \"the strategy believes\" or \"the market wants\". The reader cannot tell who holds the belief or made the choice."
    remediation: "Put the real actor in the subject. \"The plan decided to close the office\" becomes \"The board decided to close the office.\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: false-agency
    backend: dependency
    max_per_1k: 0
    severity: warning
    confidence: inferred
    message: Inanimate subject with a verb that needs an animate agent.
    params:
      require_inanimate: true
      # Pairs handled by the exemption sub-rules below.
      exclude:
        - {subjects: [report, contract, paper, study, sign, section, clause, article, document, letter, email, law, statute, policy], verbs: [say, tell, suggest, argue, insist, admit, claim, state, whisper, scream, promise, warn, agree, disagree]}
        - {subjects: [data, datum, evidence, results, result, numbers, number, figures, figure, findings, finding, analysis, metrics, metric], verbs: [agree, disagree, suggest, show, indicate, point, want, decide, choose, try, refuse, prefer, intend, seek, love, hate, enjoy, suffer, struggle, fear, care, see, notice, watch, hear, listen, feel]}
    patterns:
      - - {RIGHT_ID: verb, RIGHT_ATTRS: {LEMMA: {IN: [say, tell, suggest, argue, insist, admit, claim, state, whisper, scream, promise, warn, know, believe, think, remember, understand, realize, assume, expect, want, decide, choose, try, refuse, prefer, intend, seek, see, notice, watch, hear, listen, feel, love, hate, enjoy, suffer, struggle, fear, care, agree, disagree]}, POS: VERB}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: subj, RIGHT_ATTRS: {DEP: nsubj}}
    anchor: subj
  - id: feature-works
    description: "A thing that \"works without\" something, as in \"the cache works without a config\". The verb credits the thing with effort and hides the rule, so the reader cannot tell what the software does or what they may leave out."
    remediation: "State the rule as an instruction or a condition. Write \"You do not need to declare a file\" or \"Any file in the repository is allowed.\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: false-agency
    backend: dependency
    max_per_1k: 0
    severity: info
    confidence: inferred
    message: Inanimate subject that "works without" something. State what the reader may skip.
    params:
      require_inanimate: true
    patterns:
      - - {RIGHT_ID: verb, RIGHT_ATTRS: {LEMMA: work, POS: VERB}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: subj, RIGHT_ATTRS: {DEP: nsubj}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: prep, RIGHT_ATTRS: {LOWER: without, DEP: prep}}
      - - {RIGHT_ID: verb, RIGHT_ATTRS: {LEMMA: work, POS: VERB}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: subj, RIGHT_ATTRS: {DEP: nsubj}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: prep, RIGHT_ATTRS: {LOWER: with, DEP: prep}}
        - {LEFT_ID: prep, REL_OP: ">", RIGHT_ID: pob, RIGHT_ATTRS: {DEP: pobj}}
        - {LEFT_ID: pob, REL_OP: ">", RIGHT_ID: neg, RIGHT_ATTRS: {LOWER: "no"}}
      # The tagger reads "works" after a prepositional phrase as a noun ("A file anywhere in the
      # repository works without a declaration"), leaving the subject as the sentence root.
      - - {RIGHT_ID: subj, RIGHT_ATTRS: {DEP: ROOT, POS: NOUN}}
        - {LEFT_ID: subj, REL_OP: ">>", RIGHT_ID: verb, RIGHT_ATTRS: {LOWER: works, POS: NOUN}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: prep, RIGHT_ATTRS: {LOWER: without, DEP: prep}}
  - id: says-so-tag
    description: "A coordinated tail that repeats what the clause already shows, such as \"checks the file and says so\", \"names the cause and says so plainly\" or \"records the failure and says as much\". The tool is credited with announcing its own action, and the reader gets the same fact twice."
    remediation: "Delete the tail. \"The check fails and says so\" becomes \"The check fails.\" If the message matters, quote it: \"The check fails with 'file missing'.\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: false-agency
    backend: dependency
    max_per_1k: 0
    severity: warning
    confidence: inferred
    message: Tail that restates the action ("and says so"). Delete it or quote the message.
    params:
      require_inanimate: true
    patterns:
      - - {RIGHT_ID: head, RIGHT_ATTRS: {POS: VERB}}
        - {LEFT_ID: head, REL_OP: ">", RIGHT_ID: subj, RIGHT_ATTRS: {DEP: nsubj}}
        - {LEFT_ID: head, REL_OP: ">", RIGHT_ID: verb, RIGHT_ATTRS: {LEMMA: {IN: [say, tell]}, DEP: conj}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: tag, RIGHT_ATTRS: {LOWER: so, DEP: advmod}}
      - - {RIGHT_ID: head, RIGHT_ATTRS: {POS: VERB}}
        - {LEFT_ID: head, REL_OP: ">", RIGHT_ID: subj, RIGHT_ATTRS: {DEP: nsubj}}
        - {LEFT_ID: head, REL_OP: ">", RIGHT_ID: verb, RIGHT_ATTRS: {LEMMA: say, DEP: conj}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: tag, RIGHT_ATTRS: {LOWER: much, DEP: dobj}}
      # "and says so plainly" / "and says so in plain words": the tagger hangs "so" under the modifier
      - - {RIGHT_ID: head, RIGHT_ATTRS: {POS: VERB}}
        - {LEFT_ID: head, REL_OP: ">", RIGHT_ID: subj, RIGHT_ATTRS: {DEP: nsubj}}
        - {LEFT_ID: head, REL_OP: ">", RIGHT_ID: verb, RIGHT_ATTRS: {LEMMA: {IN: [say, tell]}, DEP: conj}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: mod, RIGHT_ATTRS: {LOWER: {IN: [in, plainly, clearly, explicitly,
            openly, loudly, directly, outright, bluntly, politely]}}}
        - {LEFT_ID: mod, REL_OP: ">", RIGHT_ID: tag, RIGHT_ATTRS: {LOWER: so, DEP: advmod}}
  - id: document-source
    description: "A document as the speaker, as in \"the report says\" or \"the contract states\". This is standard English; the rule fires only past four per thousand words, where the reader loses track of who wrote what."
    remediation: "Give the author when it helps, and vary the form. \"The study argues that...\" becomes \"The authors argue that...\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: false-agency
    backend: dependency
    max_per_1k: 4
    severity: info
    confidence: inferred
    message: Document as speaker. Standard English, allowed in small doses.
    params:
      subjects: [report, contract, paper, study, sign, section, clause, article, document, letter, email, law, statute, policy]
    patterns:
      - - {RIGHT_ID: verb, RIGHT_ATTRS: {LEMMA: {IN: [say, tell, suggest, argue, insist, admit, claim, state, whisper, scream, promise, warn]}, POS: VERB}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: subj, RIGHT_ATTRS: {DEP: nsubj}}
    anchor: subj
  - id: data-agency
    description: "Data as the speaker, as in \"the data suggest\" or \"the results show\". This is standard English; the rule fires only past two per thousand words, where it hides who drew the conclusion."
    remediation: "Give the number, or say who read the data that way. \"The data suggest demand is falling\" becomes \"Orders fell 8% in May.\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: false-agency
    backend: dependency
    max_per_1k: 2
    severity: info
    confidence: inferred
    message: Data as speaker ("the data suggest"). Standard English, allowed in small doses.
    params:
      subjects: [data, datum, evidence, results, result, numbers, number, figures, figure, findings, finding, analysis, metrics, metric]
    patterns:
      - - {RIGHT_ID: verb, RIGHT_ATTRS: {LEMMA: {IN: [suggest, show, indicate, point]}, POS: VERB}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: subj, RIGHT_ATTRS: {DEP: nsubj}}
    anchor: subj
  - id: data-agency-agentive
    description: "Data given wants, feelings or senses, as in \"the numbers want to go up\" or \"the evidence refuses to fit\". The figure of speech hides who drew the conclusion."
    remediation: "State the finding and who made it. \"The data refuses to support the plan\" becomes \"Sales fell in both test cities, so we dropped the plan.\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: false-agency
    backend: dependency
    max_per_1k: 0
    severity: warning
    confidence: inferred
    message: Data given wants, feelings or perception.
    params:
      subjects: [data, datum, evidence, results, result, numbers, number, figures, figure, findings, finding, analysis, metrics, metric]
    patterns:
      - - {RIGHT_ID: verb, RIGHT_ATTRS: {LEMMA: {IN: [want, decide, choose, try, refuse, prefer, intend, seek, love, hate, enjoy, suffer, struggle, fear, care, see, notice, watch, hear, listen, feel]}, POS: VERB}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: subj, RIGHT_ATTRS: {DEP: nsubj}}
    anchor: subj
  - id: long-sentence
    description: "A sentence of more than 35 words. This is a general style rule that fires past two per thousand words. The reader has to hold many parts in mind before reaching the point."
    remediation: "Split the sentence at a conjunction or a comma, with one idea per sentence. Aim for 25 words or fewer."
    applies_to: [text]  # judges full sentences; titles, subtitles and items are fragments
    category: verbosity
    backend: structural
    function: long_sentence
    max_per_1k: 2
    severity: warning
    confidence: exact
    message: Sentence is too long.
    params: {max_words: 35}
  - id: nominalization
    description: "Verbs turned into nouns ending in -tion, -ment, -ance, -ence, -ity or -ness, as in \"make a decision\" or \"the implementation of\". This is a general style rule. Heavy use hides the action and lengthens sentences."
    remediation: "Use the verb. \"We made a decision to start the implementation\" becomes \"We decided to build it.\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: verbosity
    backend: structural
    function: nominalization
    max_per_1k: 5
    severity: info
    confidence: inferred
    message: Nominalization. Prefer the verb.
    params: {suffixes: [tion, ment, ance, ence, ity, ness]}
  - id: expletive-construction
    description: "A sentence that opens with \"there is\" or \"it is\" and pushes the real subject later. This is a general style rule. The opener adds words and delays the actor."
    remediation: "Start with the real subject. \"There are three bugs in the parser\" becomes \"The parser has three bugs.\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: verbosity
    backend: structural
    function: expletive_construction
    max_per_1k: 2
    severity: info
    confidence: exact
    message: Expletive construction (there is, it is). A style rule, not a sign of AI writing; start with the real subject.
  - id: function-word-ratio
    description: "Text where the share of small words such as \"the\", \"of\" and \"to\" falls below 35% or above 65%. Too few gives a pile of nouns, as in a heading like \"Platform growth enablement roadmap\". Too many gives padding."
    remediation: "In a title, add a verb and state the point. In prose, turn stacked nouns into a clause or cut filler words. \"Customer retention improvement plan\" becomes \"Keep more customers past the first month.\""
    applies_to: [title, subtitle, text]  # a title of mostly small words names nothing
    category: verbosity
    backend: structural
    function: function_word_ratio
    max_per_1k: 0
    severity: info
    confidence: inferred
    message: Function-word ratio is outside the band.
    params: {min: 0.35, max: 0.65, min_words: 8}
  - id: syllables-per-word
    description: "A sentence whose words average more than 1.8 syllables. This is a general style rule. Long Latinate words slow the reader down."
    remediation: "Swap long words for short ones. \"Utilize the functionality\" becomes \"Use the feature.\""
    applies_to: [text]  # judges full sentences; titles, subtitles and items are fragments
    category: verbosity
    backend: structural
    function: syllables_per_word
    max_per_1k: 0
    severity: info
    confidence: inferred
    message: Average syllables per word is high.
    params: {max: 1.8, min_words: 8}
  - id: sentence-length-variance
    description: "Five or more sentences of nearly the same length. The even rhythm tires the reader and gives every sentence the same weight."
    remediation: "Vary the lengths. Join two short sentences, split a long one, and put a short sentence after a long one when you want the reader to stop on it."
    applies_to: [text]  # judges full sentences; titles, subtitles and items are fragments
    category: verbosity
    backend: structural
    function: sentence_length_variance
    max_per_1k: 0
    severity: info
    confidence: inferred
    message: Sentence lengths are uniform. Vary the rhythm.
    params: {min_sentences: 5, min_stdev: 3.0}
  - id: intro-transition-comma
    description: "A transitional opener such as \"However\" or \"For example\" with no comma after it. The reader may misread where the main clause starts."
    remediation: "Add the comma. \"However the build failed\" becomes \"However, the build failed.\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: sentence-flow
    backend: structural
    function: intro_transition_comma
    max_per_1k: 0
    severity: warning
    confidence: exact
    message: Transitional opener needs a comma.
    params:
      openers: [however, therefore, moreover, furthermore, additionally, consequently,
        nevertheless, nonetheless, meanwhile, otherwise, finally, similarly, likewise,
        accordingly, subsequently, alternatively, specifically, for example, for instance,
        in addition, in contrast, in conclusion, in fact, in particular, in summary,
        on the other hand, as a result, of course, in other words, by contrast, after all,
        at the same time]
  - id: lowercase-after-terminal
    description: "A lowercase word right after a period, question mark or exclamation mark. It usually means a typo or two sentences joined by mistake."
    remediation: "Capitalize the next word, or join the sentences if they belong together. \"It ended. then he left.\" becomes \"It ended. Then he left.\""
    applies_to: [text]  # judges full sentences; titles, subtitles and items are fragments
    category: sentence-flow
    backend: structural
    function: lowercase_after_terminal
    max_per_1k: 0
    severity: warning
    confidence: exact
    message: Lowercase word after a sentence-ending mark.
  - id: run-on-missing-comma
    description: "Two full clauses joined by \"and\", \"but\" or \"so\" with no comma before the conjunction. The reader can lose track of where the first clause ends."
    remediation: "Add a comma before the conjunction. \"The build failed and the team fixed it\" becomes \"The build failed, and the team fixed it.\""
    applies_to: [text]  # judges full sentences; titles, subtitles and items are fragments
    category: sentence-flow
    backend: structural
    function: run_on_missing_comma
    max_per_1k: 0
    severity: warning
    confidence: inferred
    message: Missing comma before the conjunction joining two clauses.
  - id: comma-splice
    description: "Two full sentences joined by a comma alone. The reader cannot tell how they relate."
    remediation: "Use a period, a semicolon or a conjunction. \"The build failed, the team fixed it\" becomes \"The build failed. The team fixed it.\""
    applies_to: [text]  # judges full sentences; titles, subtitles and items are fragments
    category: sentence-flow
    backend: structural
    function: comma_splice
    max_per_1k: 0
    severity: warning
    confidence: inferred
    message: Comma splice. Use a period, semicolon, or conjunction.
  - id: clause-overload
    description: "A sentence with more than four clauses. The reader has to track several subjects and verbs at once."
    remediation: "Split the sentence so that each new sentence has one or two clauses."
    applies_to: [text]  # judges full sentences; titles, subtitles and items are fragments
    category: sentence-flow
    backend: structural
    function: clause_overload
    max_per_1k: 0
    severity: warning
    confidence: inferred
    message: Too many clauses in one sentence.
    params: {max_heads: 4, min_commas: 1}
  - id: rare-punctuation-context
    description: "A comma or other mark in a grammatical position where edited English rarely puts one, as in \"went to the , store\". It is usually a typo or a half-finished edit."
    remediation: "Move or delete the mark. \"She went to the , store\" becomes \"She went to the store.\""
    applies_to: [text]  # judges full sentences; titles, subtitles and items are fragments
    category: sentence-flow
    backend: structural
    function: rare_punctuation_context
    max_per_1k: 0
    severity: warning
    confidence: inferred
    message: Punctuation in an unusual grammatical context.
    params: {threshold_per_10k: 10}
  - id: adjective-density
    description: "More than 0.6 adjectives per noun in a sentence. This is a general style rule. Piled-up description slows the reader and blurs the nouns."
    remediation: "Keep the adjective that adds a fact and cut the rest. \"The big bright red car\" becomes \"The red car.\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: sentence-flow
    backend: structural
    function: adjective_density
    max_per_1k: 0
    severity: info
    confidence: inferred
    message: Adjectives per noun is high.
    params: {max_ratio: 0.6, min_words: 8}
  - id: adjective-stack
    description: "Three or more adjectives in a row before one noun, as in \"a fast, simple, modern tool\". The reader has to weigh each one, and most add little."
    remediation: "Keep one adjective, or replace the stack with a fact. \"A fast, simple, modern tool\" becomes \"A tool that installs in one step.\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: sentence-flow
    backend: structural
    function: stacked_adjectives
    max_per_1k: 0
    severity: info
    confidence: exact
    message: Three or more adjectives stacked on one noun.
    params: {max_stack: 3}
  - id: framing-noun-phrase
    description: "A phrase that labels the next claim before making it, such as \"the honest answer is\", \"the simple truth is\" or \"the short version is\". It tells the reader how to take the sentence and delays it."
    remediation: "Delete the frame and start with the claim. \"The honest answer is we don't know\" becomes \"We don't know.\""
    applies_to: [title, subtitle, text, items]  # phrase-level tic; it shows in a heading too
    category: self-framing
    next_lemma: [be]
    max_per_1k: 0
    severity: error
    confidence: exact
    message: Announces the character of what follows. Delete the framing.
    pattern:
      - {POS: DET}
      - {LEMMA: {IN: [honest, simple, short, real, practical, blunt, charitable, generous, cynical, optimistic, pessimistic, uncomfortable, obvious, boring, useful, interesting]}}
      - {LEMMA: {IN: [framing, answer, truth, version, reading, take, view, case, picture, story, way, point, reality]}}
  - id: framing-adverbial
    description: "Clause openers such as \"honestly\", \"frankly\", \"to be fair\" and \"put simply\" that announce the tone of the sentence. They imply that the rest of the text is less honest or less plain."
    remediation: "Delete the opener. \"Frankly, the plan is late\" becomes \"The plan is late.\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: self-framing
    position: clause-initial
    max_per_1k: 0
    severity: error
    confidence: exact
    match: lower
    message: Announces the character of what follows. Delete the framing.
    phrases: [to be honest, honestly, frankly, to be fair, to be blunt, put simply, simply put,
      put another way, in plain terms, the way to think about it, "if we're being honest",
      the honest version, realistically speaking]
  - id: framing-meta
    description: "Phrases that talk about the sentence, such as \"what this means is\", \"in other words\" and \"let me be clear\". They put a step between the reader and the point."
    remediation: "Delete the phrase and say the thing once. If a second wording seems needed, rewrite the first one. \"What this means is the build is slow\" becomes \"The build is slow.\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: self-framing
    max_per_1k: 0
    severity: error
    confidence: exact
    match: lower
    message: Talks about the sentence instead of saying it. Delete the framing.
    phrases: ["what I'm saying is", what this means is, "the point I'm making", let me be clear,
      to put it another way, in other words, which is to say, that is to say]
  - id: names-verb
    description: "The verb \"names\" or \"naming\" used vaguely, as in \"the error names the rule\". The reader cannot tell whether the text shows, lists, blames or picks the thing."
    remediation: "Use a verb that tells what happens. \"The report names the culprit\" becomes \"The report shows which commit broke the build.\""
    applies_to: [title, subtitle, text, items]  # phrase-level tic; it shows in a heading too
    category: self-framing
    max_per_1k: 0
    severity: error
    confidence: exact
    message: 'Vague verb. Say what it shows: "the error says which rule", not "names the rule".'
    pattern:
      - {LOWER: {IN: [names, naming]}, POS: VERB}
  - id: self-repetition
    description: "A phrase of two to four words that the writer repeats three or more times, at least 40 words apart. Terms and proper nouns are skipped; what remains reads as a verbal habit."
    remediation: "Keep the phrase in the one place where it says the most. Elsewhere, use a more exact wording or cut it."
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: redundancy
    backend: structural
    function: repeated_ngram
    max_per_1k: 0
    severity: warning
    confidence: inferred
    message: A phrase the writer keeps returning to.
    params:
      n: [2, 3, 4]
      min_occurrences: 3
      min_words_apart: 40
      exclude_pos_only: [DET, ADP, PRON, AUX, PART, CCONJ, SCONJ]
      exclude_proper_nouns: true
      skip_compounds: true   # "interest rate", "espresso shot": terminology, not a habit
      key_term_min: 2        # skip when a noun in the phrase is used twice more on its own
      report: first          # one finding per phrase (lines listed), not one per occurrence
  - id: passive-agentless
    description: "Passive voice with no actor, as in \"mistakes were made\". This is a general style rule; models write fewer passives than people do. Past two per thousand words, the reader often cannot tell who did what."
    remediation: "Say who did it and put them first. \"The server was restarted\" becomes \"Ana restarted the server.\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: construction
    backend: structural
    function: passive_agentless
    max_per_1k: 2
    severity: warning
    confidence: exact
    message: Passive voice with no agent. A style rule, not a sign of AI writing (models use fewer passives than people); name who did it.
  - id: passive-with-agent
    description: "Passive voice that gives the actor after \"by\", as in \"the bug was found by Ana\". This is a general style rule. The sentence runs longer than the active form and puts the actor last."
    remediation: "Put the actor first. \"The bug was found by Ana\" becomes \"Ana found the bug.\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: construction
    backend: structural
    function: passive_with_agent
    max_per_1k: 4
    severity: info
    confidence: exact
    message: Passive voice. Consider putting the actor first.
  - id: adverb-propped-verb
    description: "A weak verb such as \"walk\", \"go\" or \"make\" with an adverb that supplies the meaning, as in \"walked slowly\". This is a general style rule. One exact verb is shorter and clearer."
    remediation: "Use a stronger verb. \"He walked slowly to the door\" becomes \"He shuffled to the door.\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: construction
    backend: structural
    function: adverb_propped_verb
    max_per_1k: 2
    severity: info
    confidence: inferred
    message: A weak verb held up by an adverb. Use a stronger verb.
    params: {weak_verbs: [walk, run, say, look, move, go, put, get, make, take, do]}
  - id: noun-stacking
    description: "Three or more nouns in a row, with the first ones acting as modifiers, as in \"quality score threshold\". The reader has to work out how each noun relates to the next."
    remediation: "Turn some of the nouns into a phrase with \"of\", \"for\" or a verb. \"The customer data migration plan\" becomes \"The plan to move customer data.\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: construction
    backend: structural
    function: compound_chain
    max_per_1k: 1
    severity: warning
    confidence: exact
    message: Three or more nouns stacked as modifiers.
    params: {min_length: 3}
  - id: preposition-chain
    description: "Four or more prepositional phrases nested in one sentence, as in \"the cause of the delay in the release of the update for the app\". The reader loses track of what modifies what."
    remediation: "Break the chain with a verb or a second sentence. \"The cause of the delay in the release of the update\" becomes \"The update shipped late because the tests failed.\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: construction
    backend: structural
    function: nested_prep_depth
    count_scope: sentence
    max_per_scope: 0
    severity: warning
    confidence: exact
    message: Prepositional phrases nested too deeply.
    params: {min_depth: 4}
  - id: subject-verb-distance
    description: "More than eight words between a subject and its verb. The reader has to keep the subject in mind while waiting for the action."
    remediation: "Move the words between them to the end of the sentence or to a sentence of their own. \"The team, after three weeks of tests on two servers, shipped\" becomes \"The team shipped after three weeks of tests on two servers.\""
    applies_to: [text]  # judges full sentences; titles, subtitles and items are fragments
    category: construction
    backend: structural
    function: subj_verb_gap
    max_per_1k: 1
    severity: warning
    confidence: exact
    message: Too many words between the subject and its verb.
    params: {max_tokens: 8}
  - id: weasel-attribution
    description: "Claims credited to unnamed sources, such as \"studies show\", \"experts say\" and \"many believe\". The reader cannot check or judge the source. The rule skips a phrase with a name close by."
    remediation: "Give the source, or state the claim as your own with the evidence. \"Studies show sleep helps memory\" becomes \"A 2019 study of 200 students found that sleep helped recall.\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: construction
    suppress_if:
      - near: {pos: PROPN, within: 10}
      - near: {ent: [PERSON, ORG, GPE, NORP], within: 10}
    max_per_1k: 0
    severity: error
    confidence: inferred
    message: Unnamed source. Say who.
    phrases: [studies show, research shows, experts say, it is widely believed, many believe,
      it is often said, some argue, critics say]
  - id: double-negation
    description: "Two negatives in one clause, as in \"not uncommon\" or \"never fails to\". The reader has to cancel them out to get the meaning."
    remediation: "State it positively. \"It never fails to start\" becomes \"It always starts.\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: construction
    backend: structural
    function: two_neg_in_clause
    count_scope: clause
    max_per_scope: 1
    severity: warning
    confidence: exact
    message: Two negatives in one clause. State it positively.
  - id: tautology
    description: "Redundant pairs such as \"end result\", \"past history\", \"close proximity\" and \"each and every\". One word repeats the other."
    remediation: "Drop the extra word. \"The end result\" becomes \"The result.\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: redundancy
    max_per_1k: 0
    severity: error
    confidence: exact
    message: Redundant pair. Drop one word.
    phrases: [advance planning, completely eliminate, end result, free gift, past history,
      future plans, close proximity, basic fundamentals, each and every, first and foremost,
      unexpected surprise]
  # Topic structure: YAML query rules over the topic graph's record sets. They stay silent when
  # the text is too short for topic analysis.
  - id: topic-drift
    description: "The point where a text leaves its main topic and never comes back. It reads only text long enough for topic analysis and skips documents split into sections."
    remediation: "Cut the drifting part or move it to its own section or document. If it belongs, tie it to the main topic in its first sentence."
    applies_to: [title, subtitle, text, items]  # findings sit on chunks and headings of the topic report
    category: topic-structure
    backend: structural
    function: query
    max_per_1k: 0
    severity: warning
    confidence: inferred
    message: The text leaves its main topic here and does not return to it.
    params:
      records: topics.segments
      where:
        - {field: kind, op: eq, value: drift}
        - any:  # far from the anchor, or no anchor to compare with (uncalibrated)
            - {field: anchor_alignment, op: lt, value: 0.8}
            - {field: anchor_alignment, op: eq, value: null}
      detail: "Drift topic: {terms}."
      requires: {key: child_sections, eq: 0}  # a section tree changes subject by design
  - id: topic-digression
    description: "A run of chunks that leaves the main topic and then returns to it. The reader loses the thread and has to find it again."
    remediation: "Move the digression to a note, an appendix or its own section, or cut it."
    applies_to: [title, subtitle, text, items]  # findings sit on chunks and headings of the topic report
    category: topic-structure
    backend: structural
    function: query
    max_per_1k: 0
    severity: warning
    confidence: inferred
    message: A digression of {chunks} chunks before the text returns to its main topic.
    params:
      records: topics.segments
      where:
        - {field: kind, op: eq, value: digression}
        - any:  # far from the anchor, or no anchor to compare with (uncalibrated)
            - {field: anchor_alignment, op: lt, value: 0.8}
            - {field: anchor_alignment, op: eq, value: null}
      detail: "Digression topic: {terms}."
      requires: {key: child_sections, eq: 0}  # a section tree changes subject by design
  - id: off-topic-share
    description: "A text where more than 30% of the words are far from the topic of its title or anchor. Much of the length goes to something other than the stated subject."
    remediation: "Retitle the text to match what it covers, or cut the parts that stray from the title."
    applies_to: [title, subtitle, text, items]  # findings sit on chunks and headings of the topic report
    category: topic-structure
    backend: structural
    function: query
    max_per_1k: 0
    severity: warning
    confidence: inferred
    message: Much of the text sits far from its title or anchor ({share} of the words).
    params:
      records: topics.chunks
      where:
        - {field: anchor_alignment, op: lt, value: 0.75}  # uncalibrated
      aggregate: {measure: share, op: gt, value: 0.3}
      requires: {key: child_sections, eq: 0}  # a section tree changes subject by design
  - id: section-off-parent
    description: "A section of 20 or more words that shares almost no vocabulary with the sections beside it. It may belong in another document, or it may use different words for the same subject."
    remediation: "Move the section where it belongs, or link it to its neighbors in its first sentence using their terms."
    applies_to: [title, subtitle, text, items]  # findings sit on chunks and headings of the topic report
    category: topic-structure
    backend: structural
    function: query
    max_per_1k: 0
    severity: warning
    confidence: inferred
    message: Section "{heading}" shares almost no vocabulary with the sections beside it.
    params:
      records: topics.sections
      where:
        # On the planted decks the off-subject column scored 0.0 and every on-topic column 0.04
        # or more (tests/planted_topics.py build_trees).
        - {field: sibling_similarity, op: lt, value: 0.02}
        - {field: words, op: gte, value: 20}
      detail: "Similarity to the sections beside it {sibling_similarity}."
  - id: orphan-paragraph
    description: "A paragraph with weak links to every topic in the text. It reads as an aside the reader cannot place."
    remediation: "Connect it to the topic it supports, move it next to related paragraphs, or cut it."
    applies_to: [title, subtitle, text, items]  # findings sit on chunks and headings of the topic report
    category: topic-structure
    backend: structural
    function: query
    max_per_1k: 0
    severity: info
    confidence: inferred
    message: This paragraph links weakly to every topic in the text.
    params:
      records: topics.nodes
      match: any
      where:
        - {field: raw_topic, op: eq, value: -1}
        - {field: weighted_degree, op: lt, value: 0.75}  # uncalibrated; adjacency alone is 0.2
  - id: section-heading-mismatch
    description: "A section whose body does not match its heading. Role headings such as \"Overview\" or \"Summary\" are skipped. The reader expects one subject and gets another."
    remediation: "Rewrite the heading to say what the section covers, or move the body under the right heading."
    applies_to: [title, subtitle, text, items]  # findings sit on chunks and headings of the topic report
    category: topic-structure
    backend: structural
    function: query
    max_per_1k: 0
    severity: info
    confidence: inferred
    message: The body of section "{heading}" does not match its heading.
    params:
      records: topics.sections
      where:
        - {field: chunks, op: gte, value: 2}
        - {field: heading_alignment, op: lt, value: 0.3}  # uncalibrated
        # A heading of one or two content words ("Pricing", "How it fits together") names a
        # role or a topic too small to share words with the body. A word list cannot name them all.
        - {field: heading_words, op: gte, value: 3}
        # Functional headings name a role, not a subject, so their words rarely appear in the
        # body. All seven findings on pre-2020 Wikipedia were headings like these.
        - field: heading
          op: not_in
          value: [Overview, Introduction, Background, Summary, Conclusion, Conclusions,
            Discussion, Results, Methods, Applications, Uses, Synthesis, Reactions, Plot,
            Synopsis, History, Reception, Notes, Examples, Usage]
  - id: wandering-paragraph
    description: "A paragraph of four or more sentences whose second half shares almost no words with its first half. It probably holds two topics."
    remediation: "Split it into two paragraphs, one per topic, each with its own opening sentence."
    applies_to: [title, subtitle, text, items]  # findings sit on chunks and headings of the topic report
    category: topic-structure
    backend: structural
    function: query
    max_per_1k: 0
    severity: info
    confidence: inferred
    message: The second half of this paragraph shares little with the first.
    params:
      records: paragraphs
      where:
        - {field: sentences, op: gte, value: 4}
        - {field: half_overlap, op: lt, value: 0.05}  # uncalibrated
      detail: "Overlap {half_overlap}."
  - id: focus-gap-section
    description: "A section that uses none of the focus keywords you supplied and is far from the anchor topic. It runs only when you pass focus keywords."
    remediation: "Bring the section back to the focus terms, or cut it if the document does not need it."
    applies_to: [title, subtitle, text, items]  # findings sit on chunks and headings of the topic report
    category: topic-structure
    backend: structural
    function: query
    experimental: true  # needs focus keywords, which fixtures cannot pass
    max_per_1k: 0
    severity: info
    confidence: inferred
    message: Section "{heading}" uses none of the focus keywords and sits far from the anchor
      ({anchor_alignment}).
    params:
      records: topics.sections
      where:
        - {field: keyword_hits, op: eq, value: 0}
        - {field: anchor_alignment, op: lt, value: 0.6}  # uncalibrated
      requires: {key: keyword_coverage, gte: 0}
      detail: "Missing: {missing_keywords}."
  # ---- AI-slop rules from reports/AI slop and writing rules.md ("Rules to add"). Experimental
  # (reported, unscored) unless the human/AI corpora clearly support scoring; see each comment.
  # Severity follows the report's tiers: artifact = error, likely tic = warning, common in human
  # writing = info. Messages describe a writing problem and its fix, never an authorship verdict.
  - id: assistant-leakage
    description: "Chat-assistant text left in a draft, such as \"I hope this helps\", \"Certainly!\" or \"as an AI language model\". Readers can tell the text was pasted from a chat. A phrase inside quotation marks is skipped."
    remediation: "Delete the line, along with any offer to revise or any greeting to the reader."
    applies_to: [title, subtitle, text, items]  # phrase-level tic; it shows in a heading too
    category: artifacts
    max_per_1k: 0
    severity: error
    confidence: exact
    match: lower
    message: Chat-assistant text left in the draft. Delete it.
    suppress_if:
      - near: {pattern: "[\"“”]", within: 2}       # quoted, so written about, not leaked
    lower_phrases: ["i hope this helps", "certainly!", "would you like me to", "is there anything else i can",
      "here's a revised version", "here is a revised version", "here's the revised", "as an ai language model",
      "as an ai model", "as of my last knowledge update", "as of my knowledge cutoff", "as of my last update",
      "great question!", "you're absolutely right!", "you're absolutely right.", "you're right.", "i hope this message finds you well",
      "here's a template", "here is a template", "feel free to adjust", "feel free to customize"]
  - id: template-placeholder
    description: "An unfilled placeholder such as \"[Your name]\", \"INSERT_DATE\", \"2026-XX-XX\", \"example.com/\" or \"delete this section before submission\". The reader sees a draft that nobody finished."
    remediation: "Put in the real value, or delete the line. \"Best, [Your name]\" becomes \"Best, Sam.\""
    experimental: true  # until calibrated on the corpora (task 7)
    applies_to: [title, subtitle, text, items]  # phrase-level tic; it shows in a heading too
    category: artifacts
    max_per_1k: 0
    severity: error
    confidence: exact
    message: Unfilled template placeholder. Put in the real value or delete it.
    pattern:
      - [{ORTH: "["}, {LOWER: {IN: [your, insert, add, describe, enter, name, company, date, link, source, recipient, title, x]}}, {ORTH: {NOT_IN: ["]"]}, OP: "*"}, {ORTH: "]"}]
      - [{TEXT: {REGEX: "^INSERT_[A-Z_#0-9]+$"}}]
      - [{TEXT: {REGEX: "^\\d{4}$"}}, {ORTH: "-"}, {LOWER: xx}, {ORTH: "-"}, {LOWER: xx}]
    lower_phrases: [delete this section before submission, example.com/]
  - id: salience-frame
    description: "Phrases that announce importance, such as \"why this matters\", \"the trap is\", \"the whole point is\" or a closing \"Full stop.\" They ask for the reader's attention and give no reason."
    remediation: "Delete the frame and state the consequence. \"Why this matters: users lose data\" becomes \"Users lose any unsaved notes when the app closes.\""
    experimental: true  # until calibrated on the corpora (task 7)
    applies_to: [title, subtitle, text, items]  # phrase-level tic; it shows in a heading too
    category: significance-asserting
    max_per_1k: 0
    severity: warning
    confidence: exact
    message: Announces that something matters instead of showing why. Delete the frame and state the consequence.
    # "What matters" frames are their own rule, what-matters.
    lower_phrases: [why this matters, why it matters, why that matters, the tell is, the trap is, the whole point is,
      worth stating plainly, ". full stop"]
  - id: what-matters
    description: "The \"what matters\" family: \"what really matters is\", \"all that matters\", \"the fixes that matter most\" and a bare \"This matters.\" It ranks a point and gives no reason. AI-written text uses it far more often than people do, Claude most of all."
    remediation: "Say the thing and its consequence. \"What matters is uptime\" becomes \"Each hour of downtime loses about 200 orders.\""
    applies_to: [title, subtitle, text, items]  # phrase-level tic; it shows in a heading too
    category: significance-asserting
    max_per_1k: 0
    severity: warning
    confidence: exact
    message: '"What matters" frame. It ranks instead of informing; say the thing and its consequence directly.'
    pattern:
      - [{LOWER: what}, {LOWER: {IN: [really, actually, truly, ultimately]}, OP: "?"}, {LOWER: {IN: [matters, mattered]}}]
      - [{LOWER: {IN: [all, everything, nothing, thing, one]}}, {LOWER: that}, {LOWER: {IN: [really, actually, truly]}, OP: "?"},
         {LOWER: {IN: [matters, mattered]}}]
      - [{LEMMA: matter, POS: VERB}, {LOWER: {IN: [more, most, less, least]}}]
      - [{IS_SENT_START: true, LOWER: {IN: [this, that, it]}}, {LOWER: {IN: [matters, mattered]}}, {IS_PUNCT: true}]
  - id: engagement-bait
    description: "Social-media hooks such as \"let that sink in\", \"here's the kicker\", \"plot twist:\" and \"in today's fast-paced world\". They ask for attention and give no information."
    remediation: "Cut the hook and give the fact. \"Here's the kicker: it was free\" becomes \"It was free.\""
    experimental: true  # until calibrated on the corpora (task 7)
    applies_to: [title, subtitle, text, items]  # phrase-level tic; it shows in a heading too
    category: structural-tics
    max_per_1k: 0
    severity: warning
    confidence: exact
    message: Engagement bait. Cut it and give the reader the fact itself.
    lower_phrases: [let that sink in, read that again, "here's the kicker", "here's the catch", "the kicker?",
      "the irony?", "spoiler:", "plot twist:", "in today's fast-paced world", "in today's ever-evolving",
      "in today's rapidly changing", "in today's rapidly evolving", "in today's digital age",
      "in today's digital world", "in today's digital landscape", "whether you're a", imagine a world where]
  - id: source-disclaimer
    description: "Lines that disclaim the sources, such as \"based on the available information\" or \"there is limited information\". They are typical of search-assisted chat answers and tell the reader nothing about the subject."
    remediation: "State what is known and cite it, or leave the topic out. \"Based on available information, the shop has 50 staff\" becomes \"The shop had 50 staff in 2025, by its own annual report.\""
    experimental: true  # until calibrated on the corpora (task 7)
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: hedges
    max_per_1k: 0
    severity: warning
    confidence: exact
    message: Disclaims the sources instead of saying what is known. State the fact and cite it, or leave it out.
    lower_phrases: [in the provided sources, in the available sources, in the provided text, in the search results,
      based on available information, based on the available information, based on the information available,
      is limited in the available, not widely documented, not extensively documented, not publicly documented,
      there is limited information, little information is available, specific details are not available,
      details are not publicly available]
  - id: stiff-synonym
    description: "Stiff words such as \"utilize\", \"commence\", \"facilitate\" and \"pass away\" where a plain word fits. They make the text sound formal and padded."
    remediation: "Use the plain word: use, start, help, try, move, died, wrote. \"We will commence testing\" becomes \"We will start testing.\""
    experimental: true  # until calibrated on the corpora (task 7)
    applies_to: [title, subtitle, text, items]  # phrase-level tic; it shows in a heading too
    category: verbosity
    max_per_1k: 1
    severity: info
    confidence: exact
    message: Stiff word. Use the plain one (use, start, help, try, move, died, wrote).
    pattern:
      - [{LEMMA: {IN: [utilize, utilise, commence, facilitate, endeavor, endeavour, relocate, author]}, POS: VERB}]
    phrases: [pass away]
  - id: ease-words
    description: "Words such as \"simply\", \"easily\", \"just\" and \"of course\" that call a step easy. A reader who finds the step hard then blames themselves. The rule is off by default and the technical profile turns it on."
    remediation: "Delete the word. \"Simply run the installer\" becomes \"Run the installer.\""
    applies_to: [title, subtitle, text, items]  # phrase-level tic; it shows in a heading too
    category: intensifiers
    enabled: false     # on only in the technical profile (Google developer style guide)
    max_per_1k: 0
    severity: warning
    confidence: exact
    message: Ease word. It tells the reader a step is easy when it may not be; delete it.
    pattern:
      # simply/easily/quickly, not "a simple example": the adjectives fired on 2.45 per 1k of human
      # Stack Overflow answers (above the 2.0 ceiling) mostly as plain description
      - [{LOWER: {IN: [simply, easily, quickly, obviously]}}]
      - [{LOWER: just, POS: ADV}, {POS: VERB, TAG: VB}]
    lower_phrases: [of course]
  # AI vocabulary by model era. The era is the rule id, so a stale era can be turned off alone.
  # Sources: Wikipedia "Signs of AI writing" era list; Kobak et al. 2024/25 (PubMed excess words);
  # Juzek & Ward 2025; Reinhart et al. 2025 (GPT-4o word rates). Words already in
  # corporate-tier-a/b (underscore, leverage, seamless, tapestry of, realm of) are not repeated.
  - id: ai-lexicon-gpt4
    description: "Words that models of 2023 to mid-2024 overused, such as \"delve\", \"intricate\", \"meticulous\", \"pivotal\", \"vibrant\", \"showcase\" and \"testament\". AI text used them far more often than people on several corpora, but creative and opinion writers use them too."
    remediation: "Use a plain word or the specific thing. \"A vibrant, multifaceted city\" becomes \"A city with 40 theaters and a busy port.\""
    experimental: true  # until calibrated on the corpora (task 7)
    applies_to: [title, subtitle, text, items]  # phrase-level tic; it shows in a heading too
    category: corporate-vocabulary
    max_per_1k: 1
    severity: warning
    confidence: exact
    message: Overused AI-era word (2023 to mid-2024). Use a plain word or say the specific thing.
    pattern:
      - [{LEMMA: {IN: [boast, bolster, garner, showcase, encapsulate, elucidate, harness, unveil, accentuate]}, POS: VERB}]
    # the tagger reads "delves" as a noun (lemma delf), so delve is matched by surface form
    lower_phrases: [delve, delves, delved, delving]
    phrases: [intricate, intricacy, meticulous, meticulously, commendable, pivotal, multifaceted, interplay,
      camaraderie, palpable, vibrant, invaluable, unparalleled, groundbreaking, burgeoning, testament]
  - id: ai-lexicon-gpt4o
    description: "Verbs that models of mid-2024 to mid-2025 overused: \"foster\", \"highlight\", \"enhance\", \"emphasize\" and \"align with\". AI text used them several times as often as people on most of the test corpora."
    remediation: "Say what happened. \"The report highlights the risk\" becomes \"The report lists three risks.\""
    applies_to: [title, subtitle, text, items]  # phrase-level tic; it shows in a heading too
    category: corporate-vocabulary
    max_per_1k: 1
    severity: warning
    confidence: exact
    message: Overused AI-era word (mid-2024 to mid-2025). Use a plain word or say the specific thing.
    pattern:
      - [{LEMMA: {IN: [foster, highlight, enhance, emphasize, emphasise]}, POS: VERB}]
      - [{LEMMA: align, POS: VERB}, {LOWER: with}]
  - id: ai-lexicon-gpt5
    description: "Notability boilerplate from models of mid-2025 to mid-2026, such as \"maintains an active social media presence\", \"has been widely covered\" and \"independent coverage\". It claims press attention and never says what the articles reported."
    remediation: "Say what the articles reported and cite them. \"The band has been widely covered\" becomes \"A city paper reviewed the band's first album in 2024.\""
    experimental: true  # until calibrated on the corpora (task 7)
    applies_to: [title, subtitle, text, items]  # phrase-level tic; it shows in a heading too
    category: corporate-vocabulary
    max_per_1k: 0
    severity: warning
    confidence: exact
    message: Notability boilerplate (mid-2025 to mid-2026). Say what the coverage said, with the source.
    lower_phrases: [maintains an active social media presence, maintains a strong digital presence,
      maintains an active online presence, independent media coverage, independent coverage,
      has been extensively documented, has been widely covered]
  - id: ai-lexicon-2026
    description: "Words that recent models overuse, from editor observation in mid-2026: \"dependable\", \"prioritize\", \"quietly\", \"steady\" and \"universally\". One alone is fine; a cluster reads as generated. AI text used them several times as often as people on most of the test corpora."
    remediation: "Put the specific fact in place of the word. \"The team quietly shipped a steady stream of fixes\" becomes \"The team shipped 12 fixes in May.\""
    applies_to: [title, subtitle, text, items]  # phrase-level tic; it shows in a heading too
    category: corporate-vocabulary
    max_per_1k: 2
    severity: info
    confidence: exact
    message: Word that recent models overuse (mid-2026, editor observation only). Fine alone; a cluster reads as generated.
    suppress_if:
      - near: {lemma: [state, flow, rate, growth, decline, increase], within: 1}   # "steady state" is literal
    phrases: [dependable, prioritize, quietly, steady, universally]
  - id: participial-tail
    description: "A sentence that ends in an \"-ing\" clause asserting significance, such as \", highlighting the importance of...\" or \", reflecting its role in...\". Of all the rules, this one separates AI text from human text most clearly."
    remediation: "End the sentence at the fact. Then say what follows from it in a new sentence, with evidence. \"Sales rose, reflecting strong demand\" becomes \"Sales rose 12%. Orders came in faster than the warehouse could pack them.\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: significance-asserting
    backend: dependency
    max_per_1k: 0
    severity: warning
    confidence: inferred
    anchor: tail
    message: Trailing "-ing" clause that asserts significance. End the sentence and say what follows from it, with evidence.
    patterns:
      - - {RIGHT_ID: tail, RIGHT_ATTRS: {TAG: VBG, DEP: {IN: [advcl, acl, xcomp, conj]}, POS: VERB, LEMMA: {IN: [highlight, underscore, emphasize, reflect, symbolize, showcase, contribute, foster, cultivate, enhance, ensure, solidify, cement, mark, signal, pave, embody, reinforce, demonstrate, illustrate, exemplify, set, shape, position]}}}
        - {LEFT_ID: tail, REL_OP: ";", RIGHT_ID: comma, RIGHT_ATTRS: {ORTH: ","}}
      - - {RIGHT_ID: tail, RIGHT_ATTRS: {TAG: VBG, DEP: {IN: [advcl, acl, xcomp, conj]}}}
        - {LEFT_ID: tail, REL_OP: ";", RIGHT_ID: comma, RIGHT_ATTRS: {ORTH: ","}}
        - {LEFT_ID: tail, REL_OP: ">", RIGHT_ID: obj, RIGHT_ATTRS: {DEP: dobj, LEMMA: {IN: [importance, significance, role, legacy, relevance, impact, heritage, commitment, potential, need, value]}}}
  - id: copula-inflation
    description: "\"Serves as\", \"stands as\", \"boasts\" or \"holds the distinction\" where \"is\" or \"has\" would do, as in \"the museum serves as a reminder of the war\". AI-written articles and essays use these far more often than people do. Roles such as \"she served as treasurer\" are skipped."
    remediation: "Use the plain verb. \"The hotel boasts 200 rooms\" becomes \"The hotel has 200 rooms.\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: construction
    backend: dependency
    max_per_1k: 0
    severity: warning
    confidence: inferred
    message: '"Serves as", "stands as" or "boasts" in place of "is" or "has". Use the plain verb.'
    params:
      require_inanimate: true       # "She served as treasurer" is a role, not inflation
      unresolved_inanimate: [it, this, that]    # "It serves as a reminder" counts
    patterns:
      - - {RIGHT_ID: verb, RIGHT_ATTRS: {LEMMA: {IN: [serve, stand]}, POS: VERB}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: subj, RIGHT_ATTRS: {DEP: nsubj}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: as, RIGHT_ATTRS: {LOWER: as, DEP: prep}}
      - - {RIGHT_ID: verb, RIGHT_ATTRS: {LEMMA: boast, POS: VERB}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: subj, RIGHT_ATTRS: {DEP: nsubj}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: obj, RIGHT_ATTRS: {DEP: dobj}}
      - - {RIGHT_ID: verb, RIGHT_ATTRS: {LEMMA: hold, POS: VERB}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: subj, RIGHT_ATTRS: {DEP: nsubj}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: obj, RIGHT_ATTRS: {DEP: dobj, LEMMA: distinction}}
  # Physical verbs on abstract subjects ("the plan holds", "the argument lands"). One family split
  # by the report's evidence tier, which sets severity: strong = warning, catalogued and
  # user-observed = info. The abs node is the argument whose Brysbaert concreteness must fall
  # below concreteness_max; a pattern without an abs node is a fixed shape and is not gated.
  - id: abstract-physical-verb
    description: "Dead metaphors from the strong-evidence list, which describe an idea with words for physical labor. Examples are \"load-bearing\", \"does the heavy lifting\", \"does most of the work\", \"earns its place\", \"earn trust\" and \"earn the right to\". The reader gets an image and no mechanism."
    remediation: "Say what the thing does. \"This clause does the heavy lifting\" becomes \"This clause sets the price.\""
    experimental: true  # until calibrated on the corpora (task 7)
    applies_to: [title, subtitle, text, items]  # slide titles carry "earn trust" as often as text does
    category: false-agency
    backend: dependency
    max_per_1k: 0
    severity: warning
    confidence: inferred
    anchor: abs
    concreteness_max: 4.0
    message: Physical verb on an abstract subject, a dead metaphor (strong evidence). Say what the thing does.
    params: &apv-params
      unresolved_inanimate: [this, that]    # "This does the heavy lifting": the demonstrative is an idea
      # Programming and data nouns that literally hold, map, carry and live somewhere.
      exempt: [variable, field, key, value, column, row, buffer, register, pointer, array, map, object,
        function, config, configuration, file, table, list, dict, dictionary, string, parameter,
        flag, cache, queue, stack, heap, record, cell, slot, struct, class, method, module, package,
        container, port, socket, setting, env, environment, directory, folder, path, repo, repository,
        # ... and things that literally flow.
        data, datum, traffic, request, packet, message, event, signal, stream, current, power, energy,
        money, cash, fund, water, blood, air, fluid, heat, gas, liquid, river, stream]
    patterns:
      - - {RIGHT_ID: abs, RIGHT_ATTRS: {POS: NOUN}}
        - {LEFT_ID: abs, REL_OP: ">", RIGHT_ID: bear, RIGHT_ATTRS: {LOWER: bearing}}
        - {LEFT_ID: bear, REL_OP: ";", RIGHT_ID: hyphen, RIGHT_ATTRS: {ORTH: "-"}}
        - {LEFT_ID: hyphen, REL_OP: ";", RIGHT_ID: load, RIGHT_ATTRS: {LOWER: load}}
      - - {RIGHT_ID: verb, RIGHT_ATTRS: {LEMMA: do}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: abs, RIGHT_ATTRS: {DEP: nsubj}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: obj, RIGHT_ATTRS: {DEP: dobj, LOWER: lifting}}
      - - {RIGHT_ID: verb, RIGHT_ATTRS: {LEMMA: do}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: abs, RIGHT_ATTRS: {DEP: nsubj}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: obj, RIGHT_ATTRS: {DEP: dobj, LEMMA: {IN: [lot, most, all, much]}}}
        - {LEFT_ID: obj, REL_OP: ">", RIGHT_ID: of, RIGHT_ATTRS: {LOWER: of}}
        - {LEFT_ID: of, REL_OP: ">", RIGHT_ID: work, RIGHT_ATTRS: {LEMMA: work}}
      - - {RIGHT_ID: verb, RIGHT_ATTRS: {LEMMA: earn}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: obj, RIGHT_ATTRS: {DEP: dobj, LEMMA: {IN: [keep, place, spot, seat]}}}
        - {LEFT_ID: obj, REL_OP: ">", RIGHT_ID: poss, RIGHT_ATTRS: {LOWER: its}}
      # "The first phase earned the right to grow" (an abstract subject earning trust or a right)
      - - {RIGHT_ID: verb, RIGHT_ATTRS: {LEMMA: earn}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: abs, RIGHT_ATTRS: {DEP: nsubj}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: obj, RIGHT_ATTRS: {DEP: dobj, LEMMA: {IN: [trust, right, confidence,
            credibility]}}}
      # "Earn trust with every release." / "then earn the right to scale" (an imperative slogan). The
      # tagger often reads a sentence-initial "Earn" as a noun, so these match on word order.
      - - {RIGHT_ID: verb, RIGHT_ATTRS: {LOWER: earn, IS_SENT_START: true}}
        - {LEFT_ID: verb, REL_OP: ".", RIGHT_ID: obj, RIGHT_ATTRS: {LEMMA: {IN: [trust, confidence, credibility]}}}
      - - {RIGHT_ID: verb, RIGHT_ATTRS: {LOWER: earn, IS_SENT_START: true}}
        - {LEFT_ID: verb, REL_OP: ".", RIGHT_ID: det, RIGHT_ATTRS: {LOWER: the}}
        - {LEFT_ID: det, REL_OP: ".", RIGHT_ID: obj, RIGHT_ATTRS: {LOWER: right}}
      - - {RIGHT_ID: then, RIGHT_ATTRS: {LOWER: then}}
        - {LEFT_ID: then, REL_OP: ".", RIGHT_ID: verb, RIGHT_ATTRS: {LOWER: earn}}
        - {LEFT_ID: verb, REL_OP: ".*", RIGHT_ID: obj, RIGHT_ATTRS: {LEMMA: {IN: [trust, right, confidence, credibility]}}}
  - id: abstract-physical-verb-catalogued
    description: "Physical verbs on abstract subjects, from a catalogue of known tics. Examples are \"the plan holds\", \"the joke lands\", \"the risk lives in\", \"turns every complaint into\", \"momentum flows outward\" and \"a lot rides on\". AI opinion writing uses them several times as often as people do. Code nouns that literally hold values, such as \"variable\" and \"cache\", are skipped."
    remediation: "Say in literal terms what the thing does. \"The plan holds\" becomes \"The plan still meets the June date.\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: false-agency
    backend: dependency
    max_per_1k: 0
    severity: info
    confidence: inferred
    anchor: abs
    concreteness_max: 4.0
    message: Physical verb on an abstract subject (holds, lands, carries, lives in, surfaces, unpacks). Say what the thing does.
    params: *apv-params
    patterns:
      # "The plan holds." / "The argument holds up." / "It holds true."
      - - {RIGHT_ID: verb, RIGHT_ATTRS: {LEMMA: {IN: [hold, land]}, POS: VERB}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: abs, RIGHT_ATTRS: {DEP: nsubj}}
        - {LEFT_ID: verb, REL_OP: ".", RIGHT_ID: end, RIGHT_ATTRS: {IS_PUNCT: true}}
      - - {RIGHT_ID: verb, RIGHT_ATTRS: {LEMMA: hold, POS: VERB}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: abs, RIGHT_ATTRS: {DEP: nsubj}}
        - {LEFT_ID: verb, REL_OP: ".", RIGHT_ID: part, RIGHT_ATTRS: {LOWER: {IN: [up, "true"]}}}
      - - {RIGHT_ID: verb, RIGHT_ATTRS: {LEMMA: hold, POS: VERB}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: obj, RIGHT_ATTRS: {DEP: dobj, LEMMA: {IN: [tension, contradiction]}}}
      # "The joke lands hardest" / "the point landed well"
      - - {RIGHT_ID: verb, RIGHT_ATTRS: {LEMMA: land, POS: VERB}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: abs, RIGHT_ATTRS: {DEP: nsubj}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: how, RIGHT_ATTRS: {LOWER: {IN: [hard, harder, hardest, well, differently, badly, flat]}}}
      - - {RIGHT_ID: verb, RIGHT_ATTRS: {LEMMA: carry, POS: VERB}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: abs, RIGHT_ATTRS: {DEP: nsubj}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: obj, RIGHT_ATTRS: {DEP: dobj, LEMMA: {IN: [weight, argument, meaning]}}}
      # "The risk lives in the gap"
      - - {RIGHT_ID: verb, RIGHT_ATTRS: {LEMMA: live, POS: VERB}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: abs, RIGHT_ATTRS: {DEP: nsubj}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: prep, RIGHT_ATTRS: {LOWER: {IN: [in, inside]}}}
      - - {RIGHT_ID: verb, RIGHT_ATTRS: {LEMMA: {IN: [surface, unpack, anchor]}, POS: VERB}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: abs, RIGHT_ATTRS: {DEP: dobj}}
      - - {RIGHT_ID: verb, RIGHT_ATTRS: {LEMMA: lean, POS: VERB}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: prep, RIGHT_ATTRS: {LOWER: into}}
        - {LEFT_ID: prep, REL_OP: ">", RIGHT_ID: abs, RIGHT_ATTRS: {DEP: pobj}}
      # "Doubt bleeds into every decision" / "Optimism ripples through the team"
      - - {RIGHT_ID: verb, RIGHT_ATTRS: {LEMMA: {IN: [bleed, ripple, thread, cascade, weave]}, POS: VERB}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: abs, RIGHT_ATTRS: {DEP: nsubj}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: prep, RIGHT_ATTRS: {LOWER: {IN: [into, through, across, throughout]}, DEP: prep}}
      # "The new process turns every complaint into a ticket"
      - - {RIGHT_ID: verb, RIGHT_ATTRS: {LEMMA: turn, POS: VERB}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: abs, RIGHT_ATTRS: {DEP: nsubj}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: obj, RIGHT_ATTRS: {DEP: dobj}}
        - {LEFT_ID: verb, REL_OP: ">>", RIGHT_ID: into, RIGHT_ATTRS: {LOWER: into, DEP: prep}}
      # "The redesign opens new revenue for the store"
      - - {RIGHT_ID: verb, RIGHT_ATTRS: {LEMMA: open, POS: VERB}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: abs, RIGHT_ATTRS: {DEP: nsubj}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: obj, RIGHT_ATTRS: {DEP: dobj, LEMMA: {IN: [dollar, revenue, margin, value]}}}
      # "The delay holds the conversion rate down"
      - - {RIGHT_ID: verb, RIGHT_ATTRS: {LEMMA: hold, POS: VERB}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: abs, RIGHT_ATTRS: {DEP: nsubj}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: prt, RIGHT_ATTRS: {LOWER: down, DEP: {IN: [prt, advmod, ccomp]}}}
      # "each phase earning the next", "earns its place"
      - - {RIGHT_ID: verb, RIGHT_ATTRS: {LEMMA: earn, POS: VERB}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: abs, RIGHT_ATTRS: {DEP: nsubj}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: obj, RIGHT_ATTRS: {DEP: dobj, LEMMA: {IN: [next, place, keep, spot]}}}
      # "Momentum flows outward" / "Insight flows to every team"
      # (a noun subject only: "it flows" and "which flows" are usually a river)
      - - {RIGHT_ID: verb, RIGHT_ATTRS: {LEMMA: flow, POS: VERB}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: abs, RIGHT_ATTRS: {DEP: nsubj, POS: {IN: [NOUN, PROPN]}}}
      # "A lot rides on this" ("turns on" is left out: "turned their backs on" matched)
      - - {RIGHT_ID: verb, RIGHT_ATTRS: {LEMMA: ride, POS: VERB}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: abs, RIGHT_ATTRS: {DEP: nsubj}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: prep, RIGHT_ATTRS: {LOWER: "on", DEP: prep}}
  - id: abstract-physical-verb-observed
    description: "Possible dead metaphors seen in user drafts: \"that tracks\", \"the point stands\", \"checks out\", \"sits in\" and \"maps to\". Some uses are literal, so treat a finding as a prompt to check."
    remediation: "Say what the thing does. \"That tracks\" becomes \"That matches the March numbers\", and \"where this sits in the roadmap\" becomes \"when we build this\"."
    experimental: true  # until calibrated on the corpora (task 7)
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: false-agency
    backend: dependency
    max_per_1k: 0
    severity: info
    confidence: inferred
    anchor: abs
    concreteness_max: 4.0
    message: Possible dead physical metaphor (tracks, sits in, maps to, checks out, stands). Say what the thing does.
    params: *apv-params
    patterns:
      # "That tracks." / "The point stands."
      - - {RIGHT_ID: verb, RIGHT_ATTRS: {LEMMA: track, POS: VERB}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: subj, RIGHT_ATTRS: {DEP: nsubj, LEMMA: {IN: [that, this, it, number, figure, story]}}}
        - {LEFT_ID: verb, REL_OP: ".", RIGHT_ID: end, RIGHT_ATTRS: {IS_PUNCT: true}}
      # the tagger reads a bare "That tracks." / "This maps to X" as a noun phrase
      - - {RIGHT_ID: verb, RIGHT_ATTRS: {LOWER: {IN: [tracks, tracked]}, DEP: ROOT}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: subj, RIGHT_ATTRS: {LOWER: {IN: [that, this, it]}}}
        - {LEFT_ID: verb, REL_OP: ".", RIGHT_ID: end, RIGHT_ATTRS: {IS_PUNCT: true}}
      - - {RIGHT_ID: verb, RIGHT_ATTRS: {LOWER: {IN: [maps, mapped]}, DEP: ROOT}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: subj, RIGHT_ATTRS: {LOWER: {IN: [that, this, it]}}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: prep, RIGHT_ATTRS: {LOWER: {IN: [to, onto]}}}
      - - {RIGHT_ID: verb, RIGHT_ATTRS: {LEMMA: stand, POS: VERB}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: subj, RIGHT_ATTRS: {DEP: nsubj, LEMMA: {IN: [point, argument, claim, result, criticism, objection]}}}
        - {LEFT_ID: verb, REL_OP: ".", RIGHT_ID: end, RIGHT_ATTRS: {IS_PUNCT: true}}
      - - {RIGHT_ID: verb, RIGHT_ATTRS: {LEMMA: check, POS: VERB}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: subj, RIGHT_ATTRS: {DEP: nsubj, LEMMA: {IN: [math, maths, number, logic, story, claim, figure, that, this, it]}}}
        - {LEFT_ID: verb, REL_OP: ".", RIGHT_ID: out, RIGHT_ATTRS: {LOWER: out}}
      # "where this sits in the roadmap" / "this maps to our goals"
      - - {RIGHT_ID: verb, RIGHT_ATTRS: {LEMMA: sit, POS: VERB}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: abs, RIGHT_ATTRS: {DEP: nsubj}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: prep, RIGHT_ATTRS: {LOWER: {IN: [in, within, with, at]}}}
      - - {RIGHT_ID: verb, RIGHT_ATTRS: {LEMMA: map, POS: VERB}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: abs, RIGHT_ATTRS: {DEP: nsubj}}
        - {LEFT_ID: verb, REL_OP: ">", RIGHT_ID: prep, RIGHT_ATTRS: {LOWER: {IN: [to, onto]}}}
  # Building blocks: marker rules are matched for the composites below and never reported.
  - id: number-anchor
    description: "Marker rule, never reported. It finds numbers, dates, amounts, percentages and measures, which count as specific evidence for the composites generic-paragraph and unquantified-claim."
    remediation: "No direct fix. Adding a figure to a paragraph or sentence clears generic-paragraph and unquantified-claim there."
    category: composite
    marker: true
    max_per_1k: 0
    message: A number, date, amount or measure.
    pattern:
      - [{LIKE_NUM: true}]
      - [{ENT_TYPE: {IN: [DATE, TIME, MONEY, PERCENT, QUANTITY, CARDINAL, ORDINAL]}}]
      - [{ORTH: "%"}]
  - id: name-anchor
    description: "Marker rule, never reported. It finds proper names, named entities, quotation marks and code spans, which count as specific evidence for the composite generic-paragraph."
    remediation: "No direct fix. Adding a name, a quotation or a concrete example to a paragraph clears generic-paragraph there."
    category: composite
    marker: true
    max_per_1k: 0
    message: A name, a quotation or a code span.
    pattern:
      - [{POS: PROPN, IS_SENT_START: false}]
      - [{ENT_TYPE: {IN: [PERSON, ORG, GPE, LOC, NORP, FAC, PRODUCT, EVENT, WORK_OF_ART, LAW]}}]
      - [{ORTH: {IN: ["\"", "“"]}}]
  - id: evaluative-word
    description: "Marker rule, never reported. It finds words that assert importance, such as \"crucial\", \"pivotal\", \"plays a key role\", \"foster\" and \"transformative\", for the composites generic-paragraph and recap-closer."
    remediation: "Put the fact that shows the importance in place of the word. \"Plays a crucial role in sales\" becomes \"brings in 40% of sales.\""
    category: composite
    marker: true
    max_per_1k: 0
    message: An evaluative word that asserts importance.
    phrases: [crucial, vital, pivotal, essential, key role, significant role, important role, play a role,
      significant impact, profound, landscape, ensure, enhance, foster, paramount, invaluable, transformative]
  - id: noun-stack-title
    description: "Marker rule, never reported. It finds three or more stacked nouns in a title or subtitle, as in \"quality score threshold\", for the composite weak-title."
    remediation: "Turn some of the nouns into a phrase with \"of\", \"for\" or a verb."
    applies_to: [title, subtitle]
    category: composite
    marker: true
    backend: structural
    function: compound_chain
    max_per_1k: 0
    message: Three or more nouns stacked as modifiers in a title.
    params: {min_length: 3}
  - id: recap-opener
    description: "Marker rule, never reported. It finds sentence openers that announce a summary, such as \"In conclusion\", \"Overall\", \"To sum up\" and \"In the end\", for the composite recap-closer."
    remediation: "Drop the opener. End on the last new point or on the decision."
    category: composite
    marker: true
    max_per_1k: 0
    position: sentence-initial
    message: A recap opener.
    lower_phrases: [in summary, in conclusion, to sum up, to summarize, to conclude, overall, all in all,
      ultimately, in essence, in the end]
  - id: balance-scaffold
    description: "Marker rule, never reported. It finds both-sides phrases such as \"on the other hand\", \"pros and cons\" and \"the right choice depends on your needs\", for the composite comparison-no-verdict."
    remediation: "Follow the comparison with a recommendation. \"Both have their strengths\" becomes \"Pick the small plan for teams under ten people.\""
    category: composite
    marker: true
    max_per_1k: 0
    message: Both-sides scaffolding.
    lower_phrases: [on the one hand, on the other hand, both have their strengths, both have strengths,
      pros and cons, advantages and disadvantages, strengths and weaknesses, the right choice depends,
      the best choice depends, depends on your specific needs, depends on your needs, the choice depends,
      there is no clear winner, each has its own strengths, each has its merits, one-size-fits-all]
  - id: recommendation-marker
    description: "Marker rule, never reported. It finds a recommendation or verdict, such as \"we recommend\", \"go with\", \"is the best\" or \"should choose\". When a document has one, comparison-no-verdict stays silent."
    remediation: "No fix needed. Use wording like this to state your verdict when you compare options."
    category: composite
    marker: true
    max_per_1k: 0
    message: A recommendation or verdict.
    phrases: [recommend, recommendation, we suggest, i suggest, go with, opt for, the better choice,
      the better option, is better, is the best, should use, should choose, should pick, prefer, choose]
  - id: vague-quantity
    description: "Marker rule, never reported. It finds size or change words with no number, such as \"significantly\", \"dramatically\", \"the majority of\" and \"improved\", for the composite unquantified-claim."
    remediation: "Give the figure. \"Prices fell dramatically\" becomes \"Prices fell 30% in a year.\""
    category: composite
    marker: true
    max_per_1k: 0
    message: A quantity claim without a number.
    lower_phrases: [significantly, substantially, dramatically, considerably, vastly, markedly, numerous,
      a significant, a substantial, a large number of, the majority of, greatly improved, greatly enhanced,
      improved, enhanced]
  - id: generic-paragraph
    description: "A paragraph with two or more words that assert importance, such as \"crucial\", \"pivotal\" or \"plays a key role\", and no number, name, quotation or example. AI-written essays contain it far more often than human essays."
    remediation: "Add the specific fact that shows the importance, or cut the paragraph. \"Trust plays a vital role in teams\" becomes \"Teams that skipped the weekly review missed twice as many deadlines.\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: composite
    backend: composite
    count_scope: paragraph
    max_per_scope: 0
    severity: warning
    confidence: inferred
    message: Generic paragraph. It asserts importance with no number, name or example. Add the specific fact or cut it.
    requires_all:
      - {rule: evaluative-word, min_count: 2}
    requires_none:
      - {rule: number-anchor}
      - {rule: name-anchor}
  - id: recap-closer
    description: "A recap sentence that also asserts importance, as in \"In conclusion, X plays a crucial role\". It repeats the text and adds nothing. AI-written essays and science papers use it several times as often as people do."
    remediation: "End on the last new point, or give the decision. Delete \"In conclusion, testing is vital\" and end on the test result."
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: composite
    backend: composite
    count_scope: sentence
    max_per_scope: 0
    severity: warning
    confidence: inferred
    message: Recap sentence that restates importance ("In conclusion, X plays a crucial role"). End on the last new point, or give the decision.
    requires_all:
      - {rule: recap-opener}
    requires_any:
      - {rule: evaluative-word}
      - {rule: salience-frame}
      - {rule: participial-tail}
  - id: comparison-no-verdict
    description: "A document that uses both-sides phrases twice or more, such as \"on the one hand\" and \"pros and cons\", and never recommends anything. The reader wanted to know which to pick and gets no answer."
    remediation: "Give a recommendation and say when it applies. \"Both have their merits\" becomes \"Use A unless you need offline mode; then use B.\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: composite
    backend: composite
    count_scope: document
    max_per_1k: 0
    severity: warning
    confidence: inferred
    experimental: true
    message: Compares both sides and never says which to pick. Give a recommendation and when it applies.
    requires_all:
      - {rule: balance-scaffold, min_count: 2}
    requires_none:
      - {rule: recommendation-marker}
  - id: unquantified-claim
    description: "A sentence that claims a size or change with no number, as in \"sales improved significantly\". The reader cannot judge how big the change was."
    remediation: "Give the figure and what it is compared with. \"Sales improved significantly\" becomes \"Sales rose 15% over last year.\""
    applies_to: [text, items]  # sentence style; titles and subtitles are labels
    category: composite
    backend: composite
    count_scope: sentence
    max_per_scope: 0
    severity: info
    confidence: inferred
    experimental: true
    message: Claims a size or change with no number. Give the figure (how much, compared with what).
    requires_all:
      - {rule: vague-quantity}
    requires_none:
      - {rule: number-anchor}
