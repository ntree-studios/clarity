# Recommended example rules backed by prose metrics. Not part of the default pack: copy this file
# and metrics.test.yml into .clarity/rules/ to turn them on. Each reads a registered metric
# through metric_band; the thresholds are guesses until calibrated against your own writing.
rules:
  - id: sentence-type-imbalance
    description: "One sentence type (simple, compound or complex) makes up more than 70% of a text of eight or more sentences, which flattens the rhythm. It ships in the metrics example set and is off by default."
    remediation: "Mix the types. Join some short sentences with \"because\", \"when\" or \"and\", or split a long one."
    category: prose-metrics
    backend: structural
    function: metric_band
    max_per_1k: 0
    severity: info
    confidence: exact
    message: One sentence type makes up most of the text.
    params:
      metric: sentence_type_distribution
      key: max_share
      gt: 0.70
      requires: {key: sentences, gte: 8}
  - id: monotone-openers
    description: "Most sentences in a text of eight or more open with the same word, as in a run of \"The... The... The...\". The repetition tires the reader. It ships in the metrics example set and is off by default."
    remediation: "Open some sentences with a time (\"By noon\"), a condition (\"If it rains\") or a different subject."
    category: prose-metrics
    backend: structural
    function: metric_band
    max_per_1k: 0
    severity: info
    confidence: exact
    message: Most sentences open with the same word.
    params:
      metric: sentence_opener_distribution
      key: distinct_share
      lt: 0.30
      requires: {key: sentences, gte: 8}
  - id: list-parallelism
    description: "List items that do not share a grammatical form, as in \"Fix the bug\", \"Fixing the docs\" and \"Tests\". The reader has to re-parse each item. It ships in the metrics example set and is off by default."
    remediation: "Give every item the same form. \"Fix the bug / Fixing the docs / Tests\" becomes \"Fix the bug / Update the docs / Run the tests\"."
    category: construction
    backend: structural
    function: metric_band
    max_per_1k: 0
    severity: warning
    confidence: inferred
    message: List items do not share a form.
    params:
      metric: list_parallelism
      per_issue: true
