"rule": "monotone-openers"
"should_fire":
- "The cat sat. The dog ran. The bird flew. The fish swam. The cow slept. The pig ate. The hen laid. The fox hid."
"should_not_fire":
- "The cat sat. The dog ran. The bird flew."
- "The cat sat. Then the dog ran. Because it rained, the bird stayed home. Fish swam. A cow slept. By noon the pig ate. Quietly, the hen laid an egg. Nobody saw the fox."
